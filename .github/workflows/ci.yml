name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: works/chat/package-lock.json
      - name: Install dependencies
        working-directory: works/chat
        run: npm ci
      - name: Run linter
        working-directory: works/chat
        run: npm run lint
      - name: Build
        working-directory: works/chat
        run: npm run build
      - name: Run tests
        working-directory: works/chat
        run: npm test
