name: Deploy to Firebase

on:
  push:
    branches: [main, master]

env:
  FIREBASE_SUPPRESS_REGION_WARNING: "true"

jobs:
  deploy:
    name: Deploy Hosting + Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Step 1: Deploy Hosting (always reliable — independent of Functions)
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting \
            --project my-team-chat-2255 \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      # Step 2: Functions dependencies (best-effort — hosting already deployed)
      - name: Install Functions dependencies
        continue-on-error: true
        working-directory: functions
        run: npm ci

      - name: Validate functions/index.js
        if: success()
        working-directory: functions
        run: node --check index.js

      # Step 3: Deploy Functions (best-effort — pre-existing busyAutoReply
      # trigger-type conflict must be resolved in Firebase Console first.
      # This step will not block Hosting deployment.)
      - name: Deploy Firebase Functions (best-effort)
        if: success()
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true
        run: |
          firebase deploy \
            --only functions \
            --project my-team-chat-2255 \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            --force \
          || echo "::warning::Functions deploy had errors (likely busyAutoReply trigger-type conflict). Resolve in Firebase Console by deleting the old busyAutoReply function, then re-run this workflow."
