name: Build & Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'works/chat/**'
      - '!works/chat/sync-www.js'
      - '!works/chat/*.md'
      - '!works/chat/android/app/build.gradle'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: works/chat/package-lock.json

      - name: Install web dependencies
        working-directory: works/chat
        run: npm ci

      # ── 3. Sync web source to www/ ─────────────────────────────────────────
      - name: Sync www/ from web source
        run: node works/chat/sync-www.js

      # ── 4. Capacitor CLI ───────────────────────────────────────────────────
      - name: Install Capacitor CLI
        working-directory: works/chat
        run: npm install -g @capacitor/cli@latest

      # ── 5. Java 17 ────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 6. Android SDK ─────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      # ── 7. Auto-bump versionCode ───────────────────────────────────────────
      # Reads current versionCode, adds 1, writes back before Gradle runs.
      # Both the APK and Capgo bundle will carry the same new number.
      - name: Bump versionCode
        id: version
        run: |
          GRADLE=works/chat/android/app/build.gradle
          CURRENT=$(grep -oP 'versionCode \K[0-9]+' "$GRADLE")
          NEW=$((CURRENT + 1))
          sed -i "s/versionCode $CURRENT/versionCode $NEW/" "$GRADLE"
          echo "old=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW"     >> $GITHUB_OUTPUT
          echo "Bumped versionCode: $CURRENT to $NEW"

      # ── 8. Decode release keystore ─────────────────────────────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > works/chat/android/keystore.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/works/chat/android/keystore.jks" >> $GITHUB_ENV

      # ── 9. Sync Capacitor ──────────────────────────────────────────────────
      - name: Sync Capacitor Android project
        working-directory: works/chat
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      # ── 10. Build signed APK and AAB in one Gradle run ────────────────────
      # APK  = direct install / sideload / testing
      # AAB  = Google Play Store (required for all new apps since Aug 2021)
      - name: Build signed release APK and AAB
        working-directory: works/chat/android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      # ── 11. Verify APK signature ───────────────────────────────────────────
      - name: Verify APK signature
        run: |
          APK=works/chat/android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK" || true
          else
            echo "::error::Release APK not found"; exit 1
          fi

      # ── 12. Commit bumped versionCode back to repo ─────────────────────────
      # [skip ci] in the message + build.gradle excluded from paths filter
      # means this commit never re-triggers the workflow.
      - name: Commit bumped versionCode
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add works/chat/android/app/build.gradle
          git commit -m "chore: bump versionCode to ${{ steps.version.outputs.new }} [skip ci]"
          git push

      # ── 13. Push OTA bundle to Capgo ──────────────────────────────────────
      # Silently skipped when CAPGO_TOKEN is not set.
      # Installed APKs pull this bundle on next cold start — no store needed
      # for web-only changes (CSS, JS, HTML inside www/).
      #
      # One-time setup (free, up to 200 devices):
      #   1. https://capgo.app → sign up
      #   2. Run:  npx @capgo/cli init   (in works/chat/ locally)
      #   3. GitHub repo Settings → Secrets → Actions → New secret
      #      Name: CAPGO_TOKEN   Value: API key from Capgo dashboard
      - name: Push OTA bundle to Capgo
        if: ${{ secrets.CAPGO_TOKEN != '' }}
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        working-directory: works/chat
        run: |
          npm install -g @capgo/cli@latest
          npx capgo bundle upload \
            --apikey "$CAPGO_TOKEN" \
            --channel production \
            --bundle ${{ steps.version.outputs.new }}

      # ── 14. Upload signed APK artifact ────────────────────────────────────
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-team-chat-v${{ steps.version.outputs.new }}-apk
          path: works/chat/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 15. Upload signed AAB artifact (Play Store ready) ─────────────────
      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: my-team-chat-v${{ steps.version.outputs.new }}-aab-playstore
          path: works/chat/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      # ── 16. Upload to Google Play internal track ───────────────────────────
      # Silently skipped when GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set.
      # Uses AAB, which Play Store requires for all new app submissions.
      - name: Upload to Google Play internal track
        if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nishad.myteamchat
          releaseFiles: works/chat/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: .github/whatsnew

      # ── 17. Summary ────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## Build complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "versionCode bumped from ${{ steps.version.outputs.old }} to ${{ steps.version.outputs.new }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Signed APK (sideload / test) | uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed AAB (Play Store ready) | uploaded |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.CAPGO_TOKEN }}" ]; then
            echo "| Capgo OTA bundle | pushed to production channel |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Capgo OTA bundle | skipped — set CAPGO_TOKEN secret to enable |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "| Google Play internal track | submitted |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Google Play internal track | skipped — set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON to enable |" >> $GITHUB_STEP_SUMMARY
          fi
