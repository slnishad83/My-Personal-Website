name: Build Android APK

on:
  workflow_dispatch:          # Run manually from GitHub Actions tab
  push:
    branches: [main]
    paths:                    # Only trigger when web source actually changes
      - 'works/chat/**'
      - '!works/chat/sync-www.js'
      - '!works/chat/*.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js (for sync-www + Capacitor CLI) ────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: works/chat/package-lock.json

      - name: Install web dependencies
        working-directory: works/chat
        run: npm ci

      # ── 3. Sync web source → www/ ────────────────────────────────────────
      - name: Sync www/ from web source
        run: node works/chat/sync-www.js

      # ── 4. Install Capacitor CLI ─────────────────────────────────────────
      - name: Install Capacitor CLI
        working-directory: works/chat
        run: npm install -g @capacitor/cli@latest

      # ── 5. Java 17 (required by Android Gradle) ──────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 6. Android SDK ───────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      # ── 7. Decode release keystore from GitHub Secret ────────────────────
      # Store your keystore as a base-64 string in the repo secret KEYSTORE_BASE64.
      # Generate it locally: base64 -w 0 your-release-key.jks > keystore.b64
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > works/chat/android/keystore.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/works/chat/android/keystore.jks" >> $GITHUB_ENV

      # ── 8. Add or sync Android platform ──────────────────────────────────
      - name: Sync Capacitor Android project
        working-directory: works/chat
        run: |
          # Add android platform if not present in repo
          if [ ! -d "../../android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # ── 9. Build signed release APK ──────────────────────────────────────
      - name: Build release APK
        working-directory: works/chat/android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ── 10. Verify the APK is properly signed ────────────────────────────
      - name: Verify APK signature
        run: |
          APK=works/chat/android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            echo "APK found: $APK"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK" || true
          else
            echo "::error::Release APK not found at expected path"
            exit 1
          fi

      # ── 11. Upload signed APK as build artifact ───────────────────────────
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-team-chat-release-${{ github.run_number }}
          path: works/chat/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 12. Summary ───────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## ✅ Signed Release APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Release APK (Play Store-ready) is attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "Download it from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "Make sure these are set in **Settings → Secrets → Actions**:" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEYSTORE_BASE64\` — keystore file encoded as base-64" >> $GITHUB_STEP_SUMMARY
          echo "- \`STORE_PASSWORD\` — keystore password" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEY_ALIAS\` — key alias inside the keystore" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEY_PASSWORD\` — key password" >> $GITHUB_STEP_SUMMARY
