name: Build & Release Android APK

  on:
    workflow_dispatch:
    push:
      branches: [main]
      paths:
        - 'works/chat/**'
        - '!works/chat/sync-www.js'
        - '!works/chat/*.md'
        - '!works/chat/android/app/build.gradle'   # ignore the bot's own version bump

  # Needed so the version-bump commit can be pushed back to the repo
  permissions:
    contents: write

  jobs:
    build-apk:
      runs-on: ubuntu-latest
      timeout-minutes: 45

      steps:
        # ── 1. Checkout ──────────────────────────────────────────────────────
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            # A PAT (not GITHUB_TOKEN) lets the pushed commit trigger Firebase deploy.
            # Fall back to GITHUB_TOKEN if VERSION_BUMP_TOKEN is not set.
            token: ${{ secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

        # ── 2. Node.js ───────────────────────────────────────────────────────
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: works/chat/package-lock.json

        - name: Install web dependencies
          working-directory: works/chat
          run: npm ci

        # ── 3. Sync web source → www/ ────────────────────────────────────────
        - name: Sync www/ from web source
          run: node works/chat/sync-www.js

        # ── 4. Capacitor CLI ─────────────────────────────────────────────────
        - name: Install Capacitor CLI
          working-directory: works/chat
          run: npm install -g @capacitor/cli@latest

        # ── 5. Java 17 ───────────────────────────────────────────────────────
        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        # ── 6. Android SDK ───────────────────────────────────────────────────
        - name: Set up Android SDK
          uses: android-actions/setup-android@v3

        - name: Install Android build tools
          run: sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

        # ── 7. Auto-bump versionCode ─────────────────────────────────────────
        # Reads the current versionCode, adds 1, writes it back, and stores
        # the new value in GITHUB_OUTPUT for use in later steps.
        - name: Bump versionCode
          id: version
          run: |
            GRADLE=works/chat/android/app/build.gradle
            CURRENT=$(grep -oP 'versionCode \K[0-9]+' "$GRADLE")
            NEW=$((CURRENT + 1))
            sed -i "s/versionCode $CURRENT/versionCode $NEW/" "$GRADLE"
            echo "old=$CURRENT" >> $GITHUB_OUTPUT
            echo "new=$NEW"     >> $GITHUB_OUTPUT
            echo "Bumped versionCode: $CURRENT → $NEW"

        # ── 8. Decode release keystore ───────────────────────────────────────
        - name: Decode release keystore
          env:
            KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          run: |
            echo "$KEYSTORE_BASE64" | base64 --decode > works/chat/android/keystore.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/works/chat/android/keystore.jks" >> $GITHUB_ENV

        # ── 9. Sync Capacitor ────────────────────────────────────────────────
        - name: Sync Capacitor Android project
          working-directory: works/chat
          run: |
            if [ ! -d "android" ]; then npx cap add android; fi
            npx cap sync android

        # ── 10. Build signed release APK ─────────────────────────────────────
        - name: Build release APK
          working-directory: works/chat/android
          env:
            KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
            STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          run: |
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon

        # ── 11. Verify APK signature ─────────────────────────────────────────
        - name: Verify APK signature
          run: |
            APK=works/chat/android/app/build/outputs/apk/release/app-release.apk
            if [ -f "$APK" ]; then
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK" || true
            else
              echo "::error::Release APK not found"; exit 1
            fi

        # ── 12. Commit version bump back to repo ─────────────────────────────
        # [skip ci] prevents this commit from re-triggering the workflow.
        # The build.gradle path is also excluded in the paths filter above.
        - name: Commit bumped versionCode
          run: |
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add works/chat/android/app/build.gradle
            git commit -m "chore: bump versionCode to ${{ steps.version.outputs.new }} [skip ci]"
            git push

        # ── 13. Upload APK as GitHub Actions artifact ─────────────────────────
        - name: Upload signed release APK
          uses: actions/upload-artifact@v4
          with:
            name: my-team-chat-v${{ steps.version.outputs.new }}-release-${{ github.run_number }}
            path: works/chat/android/app/build/outputs/apk/release/app-release.apk
            retention-days: 30

        # ── 14. Publish to Google Play (internal track) ───────────────────────
        # Requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret.
        # APK lands in the Internal Testing track — promote to Production manually
        # in the Play Console when you are ready.
        # Setup guide: https://github.com/r0adkll/upload-google-play#setup
        - name: Upload to Google Play — Internal track
          if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
          uses: r0adkll/upload-google-play@v1
          with:
            serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
            packageName: com.nishad.myteamchat
            releaseFiles: works/chat/android/app/build/outputs/apk/release/app-release.apk
            track: internal
            status: completed
            whatsNewDirectory: .github/whatsnew   # optional release notes dir

        # ── 15. Summary ───────────────────────────────────────────────────────
        - name: Summary
          run: |
            echo "## ✅ Release APK v${{ steps.version.outputs.new }} built" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| versionCode | ${{ steps.version.outputs.new }} (was ${{ steps.version.outputs.old }}) |" >> $GITHUB_STEP_SUMMARY
            echo "| Build | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | `${{ github.sha }}` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
              echo "**Play Store:** APK submitted to Internal track ✅" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Play Store:** Skipped — add `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON` secret to enable auto-upload." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>How to set up Google Play auto-upload</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "1. Go to **Google Play Console → Setup → API access**" >> $GITHUB_STEP_SUMMARY
              echo "2. Link to a Google Cloud project → click **Create new service account**" >> $GITHUB_STEP_SUMMARY
              echo "3. Grant the account **Release manager** role in Play Console" >> $GITHUB_STEP_SUMMARY
              echo "4. Download the JSON key for the service account" >> $GITHUB_STEP_SUMMARY
              echo "5. In this GitHub repo: **Settings → Secrets → Actions → New secret**" >> $GITHUB_STEP_SUMMARY
              echo "   Name: `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON`, Value: paste the entire JSON file" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>How to set up Firebase auto-deploy (if not already working)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Run `firebase init hosting` locally and log in" >> $GITHUB_STEP_SUMMARY
            echo "2. Run `firebase projects:list` to confirm project ID is `my-team-chat-2255`" >> $GITHUB_STEP_SUMMARY
            echo "3. Go to **Firebase Console → Project Settings → Service accounts → Generate new private key**" >> $GITHUB_STEP_SUMMARY
            echo "4. Add the JSON as GitHub Secret `FIREBASE_SERVICE_ACCOUNT`" >> $GITHUB_STEP_SUMMARY
            echo "   (Repo: **Settings → Secrets → Actions → New secret**)" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
  