<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <title>Family Calendar — Team Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <style>
    body { overflow: auto; }
    #app { display: flex; flex-direction: column; min-height: 100dvh; background: var(--bg); }
    .cal-header {
      display: flex; align-items: center; gap: var(--sp-3);
      padding: env(safe-area-inset-top,0) var(--sp-4) 0;
      height: calc(var(--header-h) + env(safe-area-inset-top,0));
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: var(--z-sticky);
    }
    .cal-nav {
      display: flex; align-items: center; gap: var(--sp-4);
      padding: var(--sp-4) var(--sp-5);
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .cal-month-label {
      flex: 1; text-align: center;
      font-size: var(--ts-lg); font-weight: 700; color: var(--text-primary);
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7,1fr);
      gap: 2px; padding: var(--sp-3) var(--sp-2);
    }
    .cal-day-header {
      text-align: center; font-size: 11px; font-weight: 600;
      color: var(--text-tertiary); text-transform: uppercase;
      padding: var(--sp-2) 0;
    }
    .cal-day {
      aspect-ratio: 1; border-radius: var(--r-md);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
      font-size: var(--ts-sm);
    }
    .cal-day:hover { background: var(--surface-3); }
    .cal-day.today { background: var(--accent-glow); color: var(--accent); font-weight: 700; }
    .cal-day.today .cal-day-num { color: var(--accent); }
    .cal-day.selected { background: var(--accent); color: white; }
    .cal-day.selected .cal-day-num { color: white; }
    .cal-day.other-month { opacity: .35; }
    .cal-day-num { font-size: var(--ts-sm); font-weight: 500; line-height: 1; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px; }
    .cal-day.selected .cal-dot { background: white; }
    .events-section { padding: var(--sp-4) var(--sp-5); flex: 1; }
    .events-heading {
      font-size: var(--ts-xs); font-weight: 600; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: .7px; margin-bottom: var(--sp-3);
    }
    .event-card {
      display: flex; align-items: flex-start; gap: var(--sp-3);
      padding: var(--sp-4); background: var(--surface); border-radius: var(--r-lg);
      border: 1px solid var(--border); margin-bottom: var(--sp-3);
      cursor: pointer; transition: box-shadow var(--dur-fast), transform var(--dur-fast) var(--ease-spring);
    }
    .event-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .event-color-bar { width: 4px; border-radius: var(--r-full); flex-shrink: 0; align-self: stretch; min-height: 40px; }
    .event-info { flex: 1; min-width: 0; }
    .event-title { font-size: var(--ts-sm); font-weight: 600; color: var(--text-primary); }
    .event-meta  { font-size: var(--ts-xs); color: var(--text-tertiary); margin-top: 3px; }
    .event-tags  { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-2); }
    .event-tag   { padding: 2px 8px; border-radius: var(--r-full); font-size: 10px; font-weight: 600; text-transform: uppercase; }
    .fab-cal {
      position: fixed; bottom: calc(var(--bottom-nav-h) + var(--sp-4)); right: var(--sp-5);
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent-grad); color: white; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
      box-shadow: var(--shadow-accent); z-index: var(--z-raised);
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .fab-cal:hover { transform: scale(1.08); }
    /* Add event modal overlay */
    .cal-modal-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center; }
    .cal-modal { background:var(--surface);border-radius:var(--r-2xl) var(--r-2xl) 0 0;width:100%;max-width:560px;padding-bottom:env(safe-area-inset-bottom,var(--sp-6));animation:sheetUp var(--dur-slow) var(--ease); }
    @keyframes sheetUp { from { transform:translateY(100%); } }
  </style>
</head>
<body>
<div id="app">
  <div class="cal-header">
    <a href="index.html" class="icon-btn" aria-label="Back"><span class="material-symbols-rounded">arrow_back</span></a>
    <span class="material-symbols-rounded" style="color:var(--accent)">calendar_month</span>
    <div style="flex:1;font-size:var(--ts-base);font-weight:700">Family Calendar</div>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme"><span class="material-symbols-rounded" id="theme-icon">dark_mode</span></button>
  </div>

  <div class="cal-nav">
    <button class="icon-btn" onclick="changeMonth(-1)" aria-label="Previous month"><span class="material-symbols-rounded">chevron_left</span></button>
    <div class="cal-month-label" id="month-label"></div>
    <button class="icon-btn" onclick="changeMonth(1)" aria-label="Next month"><span class="material-symbols-rounded">chevron_right</span></button>
  </div>

  <div class="cal-grid" id="cal-grid" role="grid" aria-label="Calendar"></div>

  <div class="events-section">
    <div class="events-heading" id="events-heading">Upcoming Events</div>
    <div id="events-list"></div>
  </div>

  <button class="fab-cal" onclick="openAddEvent()" aria-label="Add event">
    <span class="material-symbols-rounded">add</span>
  </button>
</div>

<!-- Add Event Modal -->
<div class="cal-modal-backdrop hidden" id="add-event-modal" onclick="closeAddEvent(event)">
  <div class="cal-modal" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header" style="padding:0 var(--sp-5) var(--sp-4)">
      <div style="font-size:var(--ts-base);font-weight:700">Add Event</div>
    </div>
    <div style="padding:0 var(--sp-5) var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)">
      <div class="field">
        <label class="field-label">Event Title</label>
        <input type="text" class="input" id="event-title" placeholder="e.g. Team lunch 🍽️">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)">
        <div class="field">
          <label class="field-label">Date</label>
          <input type="date" class="input" id="event-date">
        </div>
        <div class="field">
          <label class="field-label">Time</label>
          <input type="time" class="input" id="event-time">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Note (optional)</label>
        <input type="text" class="input" id="event-note" placeholder="Any details…">
      </div>
      <div class="field">
        <label class="field-label">Colour</label>
        <div style="display:flex;gap:var(--sp-2)">
          <div class="color-dot selected" data-color="#6366F1" style="width:28px;height:28px;border-radius:50%;background:#6366F1;cursor:pointer;border:2px solid transparent" onclick="selectColor(this)"></div>
          <div class="color-dot" data-color="#EC4899" style="width:28px;height:28px;border-radius:50%;background:#EC4899;cursor:pointer;border:2px solid transparent" onclick="selectColor(this)"></div>
          <div class="color-dot" data-color="#06B6D4" style="width:28px;height:28px;border-radius:50%;background:#06B6D4;cursor:pointer;border:2px solid transparent" onclick="selectColor(this)"></div>
          <div class="color-dot" data-color="#10B981" style="width:28px;height:28px;border-radius:50%;background:#10B981;cursor:pointer;border:2px solid transparent" onclick="selectColor(this)"></div>
          <div class="color-dot" data-color="#F59E0B" style="width:28px;height:28px;border-radius:50%;background:#F59E0B;cursor:pointer;border:2px solid transparent" onclick="selectColor(this)"></div>
        </div>
      </div>
      <div style="display:flex;gap:var(--sp-3)">
        <button class="btn btn-secondary" style="flex:1" onclick="closeAddEvent()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="saveEvent()">Save Event</button>
      </div>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav" style="display:flex" role="navigation">
  <a href="index.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">chat</span></div><span>Chat</span></a>
  <a href="album.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">photo_library</span></div><span>Album</span></a>
  <a href="calendar.html" class="bottom-nav-item active" aria-current="page"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">calendar_month</span></div><span>Calendar</span></a>
  <a href="expenses.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">receipt_long</span></div><span>Expenses</span></a>
  <a href="insights.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">insights</span></div><span>Insights</span></a>
</nav>

<script>
  const saved = localStorage.getItem('tc_theme')||'system';
  if (saved==='dark'||(saved==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.setAttribute('data-theme','dark');

  let current = new Date(), selectedDate = new Date(), selectedColor = '#6366F1';
  const events = [
    { id:1, title:'Team Standup', date:'2026-07-01', time:'10:00', color:'#6366F1', note:'Daily sync' },
    { id:2, title:'Design Review 🎨', date:'2026-07-03', time:'14:00', color:'#EC4899', note:'Q3 redesign review' },
    { id:3, title:'Sprint Planning', date:'2026-07-07', time:'11:00', color:'#06B6D4', note:'2-week sprint' },
    { id:4, title:'Team Lunch 🍽️', date:'2026-07-10', time:'13:00', color:'#10B981', note:'At Café Bloom' },
    { id:5, title:'Product Demo', date:'2026-07-15', time:'15:00', color:'#F59E0B', note:'Stakeholder presentation' },
  ];

  function renderCalendar() {
    const y = current.getFullYear(), m = current.getMonth();
    const label = current.toLocaleDateString('en',{month:'long',year:'numeric'});
    document.getElementById('month-label').textContent = label;

    const firstDay = new Date(y,m,1).getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const daysInPrev  = new Date(y,m,0).getDate();
    const today       = new Date();

    const grid = document.getElementById('cal-grid');
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let html   = days.map(d=>`<div class="cal-day-header">${d}</div>`).join('');

    for (let i=0; i<firstDay; i++) {
      const day = daysInPrev - firstDay + i + 1;
      html += `<div class="cal-day other-month"><span class="cal-day-num">${day}</span></div>`;
    }
    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = d===today.getDate() && m===today.getMonth() && y===today.getFullYear();
      const isSel   = d===selectedDate.getDate() && m===selectedDate.getMonth() && y===selectedDate.getFullYear();
      const hasEv   = events.some(e=>e.date===dateStr);
      html += `<div class="cal-day${isToday?' today':''}${isSel?' selected':''}" onclick="selectDay(${d})" role="gridcell" aria-label="${dateStr}${isToday?' (today)':''}">
        <span class="cal-day-num">${d}</span>
        ${hasEv?'<div class="cal-dot"></div>':''}
      </div>`;
    }
    const remaining = 42 - firstDay - daysInMonth;
    for (let i=1; i<=remaining; i++)
      html += `<div class="cal-day other-month"><span class="cal-day-num">${i}</span></div>`;

    grid.innerHTML = html;
    renderEvents();
  }

  function renderEvents() {
    const y=current.getFullYear(),m=String(current.getMonth()+1).padStart(2,'0');
    const sd = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth()+1).padStart(2,'0')}-${String(selectedDate.getDate()).padStart(2,'0')}`;
    const dayEvs = events.filter(e=>e.date===sd);
    const upcom  = events.filter(e=>e.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));
    const toShow = dayEvs.length ? dayEvs : upcom;

    document.getElementById('events-heading').textContent = dayEvs.length ? `Events on ${selectedDate.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}` : 'Upcoming Events';
    const list = document.getElementById('events-list');
    if (!toShow.length) {
      list.innerHTML = `<div class="empty-state" style="padding:var(--sp-8);min-height:auto"><div class="empty-icon" style="font-size:28px;width:64px;height:64px">📅</div><div class="empty-sub">No events${dayEvs.length===0?'':' on this day'}. Tap + to add one.</div></div>`;
      return;
    }
    list.innerHTML = toShow.map(ev=>`
      <div class="event-card" onclick="viewEvent(${ev.id})">
        <div class="event-color-bar" style="background:${ev.color}"></div>
        <div class="event-info">
          <div class="event-title">${ev.title}</div>
          <div class="event-meta">
            <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle">schedule</span>
            ${ev.date} ${ev.time?'· '+ev.time:''}
          </div>
          ${ev.note?`<div class="event-meta" style="margin-top:2px">${ev.note}</div>`:''}
        </div>
        <button class="icon-btn" onclick="event.stopPropagation();deleteEvent(${ev.id})" aria-label="Delete event">
          <span class="material-symbols-rounded" style="font-size:18px;color:var(--text-tertiary)">delete</span>
        </button>
      </div>`).join('');
  }

  function selectDay(d) {
    selectedDate = new Date(current.getFullYear(), current.getMonth(), d);
    renderCalendar();
  }
  function changeMonth(dir) { current.setMonth(current.getMonth()+dir); renderCalendar(); }
  function viewEvent(id) { const ev=events.find(e=>e.id===id); if(ev) alert(`${ev.title}\n${ev.date} ${ev.time}\n${ev.note||''}`); }
  function deleteEvent(id) { const i=events.findIndex(e=>e.id===id); if(i>-1){events.splice(i,1);renderEvents();} }

  function openAddEvent() {
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('event-date').value = today;
    document.getElementById('event-time').value = '10:00';
    document.getElementById('event-title').value = '';
    document.getElementById('event-note').value = '';
    document.getElementById('add-event-modal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('event-title').focus(),100);
  }
  function closeAddEvent(e) {
    if (!e || e.target.id==='add-event-modal') document.getElementById('add-event-modal').classList.add('hidden');
  }
  function selectColor(el) {
    document.querySelectorAll('.color-dot').forEach(d=>d.style.border='2px solid transparent');
    el.style.border = '2px solid var(--text-primary)';
    selectedColor = el.dataset.color;
  }
  function saveEvent() {
    const title = document.getElementById('event-title').value.trim();
    if (!title) { document.getElementById('event-title').focus(); return; }
    events.push({ id:Date.now(), title, date:document.getElementById('event-date').value, time:document.getElementById('event-time').value, color:selectedColor, note:document.getElementById('event-note').value });
    document.getElementById('add-event-modal').classList.add('hidden');
    renderCalendar();
  }
  function toggleTheme() {
    const html=document.documentElement, cur=html.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    html.setAttribute('data-theme',next); localStorage.setItem('tc_theme',next);
    document.getElementById('theme-icon').textContent=next==='dark'?'light_mode':'dark_mode';
  }

  renderCalendar();
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAddEvent({}); });
</script>
</body>
</html>
