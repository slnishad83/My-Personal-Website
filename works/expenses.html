<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <title>Expense Splitter — Team Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <style>
    body { overflow: auto; }
    #app { display:flex; flex-direction:column; min-height:100dvh; background:var(--bg); }
    .exp-header {
      display:flex; align-items:center; gap:var(--sp-3);
      padding:env(safe-area-inset-top,0) var(--sp-4) 0;
      height:calc(var(--header-h) + env(safe-area-inset-top,0));
      background:var(--surface); border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:var(--z-sticky);
    }
    .group-scroll { display:flex; gap:var(--sp-4); padding:var(--sp-4) var(--sp-5); overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--border); background:var(--surface); }
    .group-scroll::-webkit-scrollbar{display:none}
    .group-chip { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; flex-shrink:0; width:64px; opacity:.5; transition:opacity var(--dur-fast); background:none; border:none; }
    .group-chip.active { opacity:1; }
    .group-chip-avatar { width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px; border:2.5px solid transparent; }
    .group-chip.active .group-chip-avatar { border-color:var(--accent); }
    .group-chip-label { font-size:11px; font-weight:600; color:var(--text-secondary); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }
    .group-chip-new .group-chip-avatar { background:var(--surface-3); color:var(--text-tertiary); border:2px dashed var(--border-2); }

    .balance-summary { padding:var(--sp-5) var(--sp-5) var(--sp-3); }
    .balance-card { background:var(--accent-grad); border-radius:var(--r-2xl); padding:var(--sp-6); color:white; box-shadow:var(--shadow-accent); position:relative; overflow:hidden; }
    .balance-card::after { content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; background:rgba(255,255,255,.08); border-radius:50%; }
    .balance-total-label { font-size:var(--ts-xs); opacity:.9; font-weight:600; text-transform:uppercase; letter-spacing:.5px; position:relative; }
    .balance-total-amount { font-size:var(--ts-3xl); font-weight:800; margin-top:4px; position:relative; }
    .balance-total-sub { font-size:var(--ts-sm); opacity:.9; margin-top:8px; position:relative; }

    .section-title { font-size:var(--ts-xs); font-weight:600; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.7px; padding:0 var(--sp-5); margin-bottom:var(--sp-3); }
    .settle-card { margin:0 var(--sp-5) var(--sp-5); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); overflow:hidden; }
    .settle-row { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-4); border-bottom:1px solid var(--border); }
    .settle-row:last-child { border-bottom:none; }
    .settle-avatars { display:flex; align-items:center; }
    .settle-avatars .mini-avatar:nth-child(2) { margin-left:-10px; }
    .mini-avatar { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;border:2px solid var(--surface); }
    .mini-avatar-lg { width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;border:2.5px solid transparent; }
    .settle-text { flex:1; font-size:var(--ts-sm); color:var(--text-primary); }
    .settle-text b { font-weight:700; }
    .settle-amount { font-weight:800; font-size:var(--ts-sm); color:var(--error); }

    .expense-list { padding:0 var(--sp-5) var(--sp-6); }
    .expense-row { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0; border-bottom:1px solid var(--border); cursor:pointer; }
    .expense-row:last-child{ border-bottom:none; }
    .expense-cat-icon { width:44px;height:44px;border-radius:var(--r-md);background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; }
    .expense-info { flex:1;min-width:0; }
    .expense-title { font-size:var(--ts-sm);font-weight:600;color:var(--text-primary); }
    .expense-meta { font-size:var(--ts-xs);color:var(--text-tertiary);margin-top:2px; }
    .expense-amount-wrap { text-align:right; }
    .expense-amount { font-weight:700; font-size:var(--ts-sm); color:var(--text-primary); }
    .expense-amount-sub { font-size:11px; color:var(--text-tertiary); margin-top:1px; }

    .fab-exp { position:fixed; bottom:calc(var(--bottom-nav-h) + var(--sp-4)); right:var(--sp-5); width:56px;height:56px;border-radius:50%;background:var(--accent-grad);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow-accent); z-index:var(--z-raised); transition:transform var(--dur-fast) var(--ease-spring); }
    .fab-exp:hover{transform:scale(1.08)}

    .exp-modal-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:var(--z-modal);display:flex;align-items:flex-end;justify-content:center; }
    .exp-modal { background:var(--surface);border-radius:var(--r-2xl) var(--r-2xl) 0 0;width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,var(--sp-6));animation:sheetUp var(--dur-slow) var(--ease); }
    @keyframes sheetUp { from { transform:translateY(100%); } }

    .cat-picker { display:flex; gap:var(--sp-2); flex-wrap:wrap; }
    .cat-btn { width:44px;height:44px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2.5px solid transparent; }
    .cat-btn.selected { border-color:var(--accent); background:var(--accent-glow); }

    .payer-picker { display:flex; gap:var(--sp-3); overflow-x:auto; padding-bottom:4px; }
    .payer-option { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; flex-shrink:0; opacity:.5; background:none; border:none; }
    .payer-option.selected { opacity:1; }
    .payer-option.selected .mini-avatar-lg { border-color:var(--accent); }
    .payer-option span { font-size:10px; color:var(--text-secondary); font-weight:500; }

    .split-row { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-2) 0; cursor:pointer; }
    .split-row .mini-avatar-lg { width:36px;height:36px;font-size:13px; }
    .split-name { flex:1; font-size:var(--ts-sm); color:var(--text-primary); }

    .amount-input-wrap { display:flex; align-items:center; background:var(--surface-3); border:1.5px solid var(--border); border-radius:var(--r-md); padding:0 var(--sp-4); transition:border-color var(--dur-mid); }
    .amount-input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
    .amount-currency { font-size:var(--ts-lg); font-weight:700; color:var(--text-tertiary); }
    .amount-input { border:none;background:none;outline:none;font-size:var(--ts-xl);font-weight:700;color:var(--text-primary);padding:var(--sp-3) var(--sp-2); width:100%; }
  </style>
</head>
<body>
<div id="app">
  <div class="exp-header">
    <a href="index.html" class="icon-btn" aria-label="Back"><span class="material-symbols-rounded">arrow_back</span></a>
    <span class="material-symbols-rounded" style="color:var(--accent)">receipt_long</span>
    <div style="flex:1;font-size:var(--ts-base);font-weight:700">Expense Splitter</div>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme"><span class="material-symbols-rounded" id="theme-icon">dark_mode</span></button>
  </div>

  <div class="group-scroll" id="group-scroll" role="tablist" aria-label="Groups"></div>

  <div class="balance-summary">
    <div class="balance-card">
      <div class="balance-total-label">Your Balance</div>
      <div class="balance-total-amount" id="your-balance">₹0</div>
      <div class="balance-total-sub" id="balance-sub">You're all settled up</div>
    </div>
  </div>

  <div class="section-title">💸 Who Owes Who</div>
  <div class="settle-card" id="settle-card"></div>

  <div class="section-title">All Expenses</div>
  <div class="expense-list" id="expense-list"></div>

  <button class="fab-exp" onclick="openAddExpense()" aria-label="Add expense"><span class="material-symbols-rounded">add</span></button>
</div>

<!-- Add Expense Modal -->
<div class="exp-modal-backdrop hidden" id="add-expense-modal" onclick="closeAddExpense(event)">
  <div class="exp-modal" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header" style="padding:0 var(--sp-5) var(--sp-4)"><div style="font-size:var(--ts-base);font-weight:700">Add Expense</div></div>
    <div style="padding:0 var(--sp-5) var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-5)">
      <div class="field">
        <label class="field-label">What for?</label>
        <input type="text" class="input" id="exp-title" placeholder="e.g. Groceries, Dinner…">
      </div>
      <div class="field">
        <label class="field-label">Category</label>
        <div class="cat-picker" id="cat-picker"></div>
      </div>
      <div class="field">
        <label class="field-label">Total Amount</label>
        <div class="amount-input-wrap">
          <span class="amount-currency">₹</span>
          <input type="number" class="amount-input" id="exp-amount" placeholder="0" inputmode="decimal">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Paid by</label>
        <div class="payer-picker" id="payer-picker"></div>
      </div>
      <div class="field">
        <label class="field-label">Split between</label>
        <div id="split-picker"></div>
      </div>
      <div style="display:flex;gap:var(--sp-3)">
        <button class="btn btn-secondary" style="flex:1" onclick="closeAddExpense()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="saveExpense()">Add Expense</button>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav" style="display:flex" role="navigation">
  <a href="index.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">chat</span></div><span>Chat</span></a>
  <a href="album.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">photo_library</span></div><span>Album</span></a>
  <a href="calendar.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">calendar_month</span></div><span>Calendar</span></a>
  <a href="expenses.html" class="bottom-nav-item active" aria-current="page"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">receipt_long</span></div><span>Expenses</span></a>
  <a href="insights.html" class="bottom-nav-item"><div class="bottom-nav-item-icon"><span class="material-symbols-rounded">insights</span></div><span>Insights</span></a>
</nav>

<script>
  const saved = localStorage.getItem('tc_theme')||'system';
  if (saved==='dark'||(saved==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.setAttribute('data-theme','dark');

  const MEMBERS = {
    me:    { name:'You',          color:'#6366F1' },
    aisha: { name:'Aisha Rahman', color:'#EC4899' },
    dev:   { name:'Dev Kumar',    color:'#06B6D4' },
    priya: { name:'Priya Nair',   color:'#10B981' },
    rohan: { name:'Rohan Mehta',  color:'#F59E0B' },
    sara:  { name:'Sara Thomas',  color:'#8B5CF6' },
    arjun: { name:'Arjun Pillai', color:'#EF4444' },
  };
  const CATEGORIES = ['🍽️','🛒','🎬','🚗','⛽','🏠','🎁','💊','🛫','🎉','🏥','☕'];

  const GROUPS = [
    { id:'g1', name:'Roommates', emoji:'🏠', color:'#6366F1', members:['me','aisha','dev'] },
    { id:'g2', name:'Goa Trip',  emoji:'✈️', color:'#06B6D4', members:['me','aisha','priya','rohan','sara'] },
    { id:'g3', name:'Office Lunch', emoji:'🍽️', color:'#F59E0B', members:['me','dev','priya','arjun'] },
  ];

  let EXPENSES = [
    { id:1, groupId:'g1', title:'Monthly Rent',   cat:'🏠', amount:15000, paidBy:'me',    split:['me','aisha','dev'], date:'2026-06-28' },
    { id:2, groupId:'g1', title:'Groceries',       cat:'🛒', amount:2400,  paidBy:'aisha', split:['me','aisha','dev'], date:'2026-06-25' },
    { id:3, groupId:'g1', title:'Internet Bill',   cat:'🏠', amount:1200,  paidBy:'dev',   split:['me','aisha','dev'], date:'2026-06-20' },
    { id:4, groupId:'g2', title:'Hotel Booking',   cat:'🏠', amount:18000, paidBy:'aisha', split:['me','aisha','priya','rohan','sara'], date:'2026-06-18' },
    { id:5, groupId:'g2', title:'Flights',         cat:'🛫', amount:24000, paidBy:'me',    split:['me','aisha','priya','rohan','sara'], date:'2026-06-15' },
    { id:6, groupId:'g2', title:'Beach Dinner',    cat:'🍽️', amount:3600,  paidBy:'rohan', split:['me','aisha','priya','rohan','sara'], date:'2026-06-19' },
    { id:7, groupId:'g3', title:'Team Lunch',      cat:'🍽️', amount:1840,  paidBy:'arjun', split:['me','dev','priya','arjun'], date:'2026-06-27' },
    { id:8, groupId:'g3', title:'Coffee Run',      cat:'☕', amount:480,   paidBy:'me',    split:['me','dev','priya'], date:'2026-06-29' },
  ];

  let selectedGroupId = 'g1', selectedCat = CATEGORIES[0], selectedPayer = 'me', selectedSplit = new Set();

  function fmtINR(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }

  function renderGroups() {
    const wrap = document.getElementById('group-scroll');
    wrap.innerHTML = GROUPS.map(g => `
      <button class="group-chip${g.id===selectedGroupId?' active':''}" onclick="selectGroup('${g.id}')" role="tab" aria-selected="${g.id===selectedGroupId}">
        <div class="group-chip-avatar" style="background:${g.color}22;color:${g.color}">${g.emoji}</div>
        <div class="group-chip-label">${g.name}</div>
      </button>`).join('') +
      `<button class="group-chip group-chip-new" onclick="alert('Create a new group')">
        <div class="group-chip-avatar"><span class="material-symbols-rounded">add</span></div>
        <div class="group-chip-label">New</div>
      </button>`;
  }

  function selectGroup(id) { selectedGroupId = id; renderGroups(); renderAll(); }

  function computeBalances(groupId) {
    const group = GROUPS.find(g=>g.id===groupId);
    const balances = {}; group.members.forEach(m=>balances[m]=0);
    EXPENSES.filter(e=>e.groupId===groupId).forEach(e => {
      const share = e.amount / e.split.length;
      balances[e.paidBy] = (balances[e.paidBy]||0) + e.amount;
      e.split.forEach(p => balances[p] = (balances[p]||0) - share);
    });
    return balances;
  }

  function computeSettlements(balances) {
    const debtors   = Object.entries(balances).filter(([,v])=>v<-0.5).map(([k,v])=>({who:k,amt:-v})).sort((a,b)=>b.amt-a.amt);
    const creditors = Object.entries(balances).filter(([,v])=>v>0.5).map(([k,v])=>({who:k,amt:v})).sort((a,b)=>b.amt-a.amt);
    const settlements = [];
    let i=0,j=0;
    while (i<debtors.length && j<creditors.length) {
      const amt = Math.min(debtors[i].amt, creditors[j].amt);
      settlements.push({ from:debtors[i].who, to:creditors[j].who, amt });
      debtors[i].amt -= amt; creditors[j].amt -= amt;
      if (debtors[i].amt < 0.5) i++;
      if (creditors[j].amt < 0.5) j++;
    }
    return settlements;
  }

  function avatarHTML(memberKey, size) {
    const m = MEMBERS[memberKey];
    const initials = m.name==='You' ? 'Y' : m.name.split(' ').map(w=>w[0]).join('').slice(0,2);
    return `<div class="${size||'mini-avatar'}" style="background:${m.color}">${initials}</div>`;
  }

  function renderBalance() {
    const balances = computeBalances(selectedGroupId);
    const mine = balances['me'] || 0;
    document.getElementById('your-balance').textContent = fmtINR(Math.abs(mine));
    const sub = document.getElementById('balance-sub');
    if (Math.abs(mine) < 0.5) sub.textContent = "You're all settled up 🎉";
    else if (mine > 0) sub.textContent = `You are owed ${fmtINR(mine)} overall`;
    else sub.textContent = `You owe ${fmtINR(-mine)} overall`;
  }

  function renderSettlements() {
    const balances = computeBalances(selectedGroupId);
    const settlements = computeSettlements(balances);
    const card = document.getElementById('settle-card');
    if (!settlements.length) {
      card.innerHTML = `<div class="empty-state" style="padding:var(--sp-6);min-height:auto"><div class="empty-icon" style="font-size:24px;width:52px;height:52px">🎉</div><div class="empty-sub">Everyone is settled up in this group!</div></div>`;
      return;
    }
    card.innerHTML = settlements.map(s => `
      <div class="settle-row">
        <div class="settle-avatars">${avatarHTML(s.from)}${avatarHTML(s.to)}</div>
        <div class="settle-text"><b>${MEMBERS[s.from].name}</b> owes <b>${MEMBERS[s.to].name}</b></div>
        <div class="settle-amount">${fmtINR(s.amt)}</div>
      </div>`).join('');
  }

  function renderExpenseList() {
    const list = EXPENSES.filter(e=>e.groupId===selectedGroupId).sort((a,b)=>b.date.localeCompare(a.date));
    const el = document.getElementById('expense-list');
    if (!list.length) { el.innerHTML = `<div class="empty-state" style="padding:var(--sp-8)"><div class="empty-icon">🧾</div><div class="empty-sub">No expenses yet. Tap + to add one.</div></div>`; return; }
    el.innerHTML = list.map(e => {
      const share = e.amount / e.split.length;
      return `<div class="expense-row" onclick="viewExpense(${e.id})">
        <div class="expense-cat-icon">${e.cat}</div>
        <div class="expense-info">
          <div class="expense-title">${e.title}</div>
          <div class="expense-meta">${MEMBERS[e.paidBy].name} paid · ${e.date}</div>
        </div>
        <div class="expense-amount-wrap">
          <div class="expense-amount">${fmtINR(e.amount)}</div>
          <div class="expense-amount-sub">${fmtINR(share)} / person</div>
        </div>
      </div>`;
    }).join('');
  }

  function viewExpense(id) {
    const e = EXPENSES.find(x=>x.id===id);
    if (e) alert(`${e.cat} ${e.title}\n${fmtINR(e.amount)} paid by ${MEMBERS[e.paidBy].name}\nSplit between: ${e.split.map(s=>MEMBERS[s].name).join(', ')}`);
  }

  function renderAll() { renderBalance(); renderSettlements(); renderExpenseList(); }

  function openAddExpense() {
    const group = GROUPS.find(g=>g.id===selectedGroupId);
    selectedCat = CATEGORIES[0];
    selectedPayer = 'me';
    selectedSplit = new Set(group.members);

    document.getElementById('cat-picker').innerHTML = CATEGORIES.map(c =>
      `<div class="cat-btn${c===selectedCat?' selected':''}" onclick="pickCat(this,'${c}')">${c}</div>`).join('');

    document.getElementById('payer-picker').innerHTML = group.members.map(m => `
      <button class="payer-option${m===selectedPayer?' selected':''}" onclick="pickPayer(this,'${m}')" type="button">
        ${avatarHTML(m,'mini-avatar-lg')}
        <span>${MEMBERS[m].name.split(' ')[0]}</span>
      </button>`).join('');

    document.getElementById('split-picker').innerHTML = group.members.map(m => `
      <label class="split-row">
        ${avatarHTML(m,'mini-avatar-lg')}
        <span class="split-name">${MEMBERS[m].name}</span>
        <input type="checkbox" checked data-split="${m}" onchange="toggleSplit('${m}',this.checked)" style="width:20px;height:20px;accent-color:var(--accent)">
      </label>`).join('');

    document.getElementById('exp-title').value = '';
    document.getElementById('exp-amount').value = '';
    document.getElementById('add-expense-modal').classList.remove('hidden');
    setTimeout(()=>document.getElementById('exp-title').focus(),100);
  }
  function closeAddExpense(e) { if(!e || e.target.id==='add-expense-modal') document.getElementById('add-expense-modal').classList.add('hidden'); }
  function pickCat(el,c) { selectedCat=c; document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected')); el.classList.add('selected'); }
  function pickPayer(el,m) { selectedPayer=m; document.querySelectorAll('.payer-option').forEach(b=>b.classList.remove('selected')); el.classList.add('selected'); }
  function toggleSplit(m,checked) { if(checked) selectedSplit.add(m); else selectedSplit.delete(m); }

  function saveExpense() {
    const title = document.getElementById('exp-title').value.trim();
    const amount = parseFloat(document.getElementById('exp-amount').value);
    if (!title) { document.getElementById('exp-title').focus(); return; }
    if (!amount || amount<=0) { document.getElementById('exp-amount').focus(); return; }
    if (!selectedSplit.size) { alert('Select at least one person to split with'); return; }
    EXPENSES.push({ id:Date.now(), groupId:selectedGroupId, title, cat:selectedCat, amount, paidBy:selectedPayer, split:[...selectedSplit], date:new Date().toISOString().slice(0,10) });
    document.getElementById('add-expense-modal').classList.add('hidden');
    renderAll();
  }

  function toggleTheme() {
    const html=document.documentElement, cur=html.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    html.setAttribute('data-theme',next); localStorage.setItem('tc_theme',next);
    document.getElementById('theme-icon').textContent=next==='dark'?'light_mode':'dark_mode';
  }

  renderGroups();
  renderAll();
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAddExpense(); });
</script>
</body>
</html>
