<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#008069"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: 'unsafe-inline'; script-src 'self' https://www.gstatic.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' https: blob: data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com; frame-ancestors 'self'; form-action 'self';">
  <title>Chat Insights — Team Chat</title>
  <script>
    (function() {
      var mode = localStorage.getItem("themeMode") || (localStorage.getItem("darkMode") === "true" ? "dark" : "system");
      if (!localStorage.getItem("themeMode")) localStorage.setItem("themeMode", mode);
      var theme = mode === "system" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
      document.documentElement.dataset.theme = theme;
      var css = 'body { visibility: hidden !important; }';
      var style = document.createElement('style');
      style.type = 'text/css';
      style.appendChild(document.createTextNode(css));
      document.head.appendChild(style);
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.toggle("dark", theme === "dark");
        style.remove();
      });
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="redesign-base.css" />
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--green:#008069}
    body{background:var(--bg)}
    .content{padding:16px;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
    .card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden}
    .card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
    .card-body{padding:16px 18px}
    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:16px}
    .stat-box{text-align:center;padding:16px 10px;background:var(--brand-soft);border-radius:10px}
    .stat-num{font-size:28px;font-weight:800;color:var(--brand)}
    .stat-lbl{font-size:11px;color:var(--text-secondary);margin-top:4px;font-weight:500}
    .bar-row{display:flex;align-items:center;gap:10px;padding:6px 0}
    .bar-label{font-size:12px;color:var(--text);width:100px;flex-shrink:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
    .bar-fill{height:100%;background:var(--brand);border-radius:4px;transition:width 0.8s ease}
    .bar-count{font-size:12px;color:var(--text-secondary);width:36px;text-align:right;flex-shrink:0}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:10px}
    .emoji-item{display:flex;align-items:center;gap:6px;background:var(--brand-soft);border-radius:8px;padding:7px 12px;font-size:13px}
    .emoji-icon{font-size:20px}
    .emoji-count{font-weight:700;color:var(--text)}
    .hour-bars{display:flex;align-items:flex-end;gap:3px;height:80px;padding-top:8px}
    .hour-bar{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:0.7;transition:opacity 0.2s}
    .hour-bar:hover{opacity:1}
    .hour-bar[title]:hover::after{content:attr(title);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);font-size:10px;padding:3px 6px;border-radius:4px;white-space:nowrap;z-index:10}
    .hour-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-secondary);padding:4px 0 0}
    .loading-txt{text-align:center;color:var(--text-secondary);padding:32px;font-size:14px}
    .badge-row{display:flex;flex-wrap:wrap;gap:8px}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--text)}
    .badge .icon{font-size:14px}
  </style>
</head>
<body>
<main role="main" aria-label="Chat Insights">
<div class="app-header">
  <button class="back-btn" onclick="history.back()" aria-label="Go back"><span class="mat-icon">arrow_back</span></button>
  <button class="header-action" id="darkToggleBtn" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode"><span class="mat-icon">dark_mode</span></button>
  <h1><span class="mat-icon mat-icon--sm" style="margin-right:6px">insights</span> Your Chat Insights</h1>
</div>
<div class="content">
  <div id="loading" class="loading-txt">Analysing your chat history…</div>
  <div id="stats" style="display:none"></div>
</div>
</main>

<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
  <a class="nav-item" href="index.html" aria-label="Chat"><span class="mat-icon">chat</span><span>Chat</span></a>
  <a class="nav-item" href="album.html" aria-label="Album"><span class="mat-icon">photo_library</span><span>Album</span></a>
  <a class="nav-item" href="calendar.html" aria-label="Calendar"><span class="mat-icon">calendar_month</span><span>Calendar</span></a>
  <a class="nav-item" href="expenses.html" aria-label="Expenses"><span class="mat-icon">receipt_long</span><span>Expenses</span></a>
  <a class="nav-item active" href="insights.html" aria-current="page" aria-label="Insights"><span class="mat-icon">insights</span><span>Insights</span></a>
</nav>

<script>
const firebaseConfig = window.FIREBASE_CONFIG;
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null;

auth.onAuthStateChanged(u=>{if(!u){window.location.href='login.html';return;}currentUser=u;loadInsights();});

async function loadInsights(){
  try{
    // Fetch messages sent by this user (last 1000)
    const sentSnap=await db.collection('messages').where('senderId','==',currentUser.uid).orderBy('timestamp','desc').limit(1000).get();
    const sent=sentSnap.docs.map(d=>d.data());

    // Fetch user profile to get displayName
    const userDoc=await db.collection('users').doc(currentUser.uid).get();
    const userData=userDoc.data()||{};

    // Basic stats
    const totalSent=sent.length;
    const voiceNotes=sent.filter(m=>m.attachment&&m.attachment.type==='voice').length;
    const images=sent.filter(m=>m.attachment&&m.attachment.type==='image').length;
    const videos=sent.filter(m=>m.attachment&&m.attachment.type==='video').length;
    const textMsgs=sent.filter(m=>m.text&&!m.attachment).length;

    // Hour distribution
    const hourMap=Array(24).fill(0);
    sent.forEach(m=>{const d=m.timestamp?.toDate?m.timestamp.toDate():null;if(d)hourMap[d.getHours()]++;});
    const peakHour=hourMap.indexOf(Math.max(...hourMap));
    const peakLabel=peakHour===0?'Midnight':peakHour<12?peakHour+'am':peakHour===12?'Noon':(peakHour-12)+'pm';

    // Emoji analysis
    const emojiRe=/\p{Emoji_Presentation}/gu;
    const emojiCount={};
    sent.forEach(m=>{const matches=(m.text||'').match(emojiRe)||[];matches.forEach(e=>{emojiCount[e]=(emojiCount[e]||0)+1;});});
    const topEmojis=Object.entries(emojiCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

    // Most chatted with (from directId)
    const chatCount={};
    sent.forEach(m=>{if(m.directId){chatCount[m.directId]=(chatCount[m.directId]||0)+1;}});

    // Longest text sent
    let longestMsg='';
    sent.forEach(m=>{if((m.text||'').length>(longestMsg||'').length)longestMsg=m.text||'';});

    // Render results
    document.getElementById('loading').style.display='none';
    const statsEl=document.getElementById('stats');
    statsEl.style.display='flex';
    statsEl.innerHTML=`
      <div class="card">
        <div class="card-header">📊 Activity Overview</div>
        <div class="stats-row">
          <div class="stat-box"><div class="stat-num">${totalSent}</div><div class="stat-lbl">Messages Sent</div></div>
          <div class="stat-box"><div class="stat-num">${textMsgs}</div><div class="stat-lbl">Text Messages</div></div>
          <div class="stat-box"><div class="stat-num">${images+videos}</div><div class="stat-lbl">Media Shared</div></div>
          <div class="stat-box"><div class="stat-num">${voiceNotes}</div><div class="stat-lbl">Voice Notes</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">⏰ Peak Active Hour</div>
        <div class="card-body" style="text-align:center;padding:24px">
          <div style="font-size:36px">⚡</div>
          <div style="font-size:20px;font-weight:800;margin-top:8px;color:var(--brand)">${peakLabel}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">You send most of your messages around this time.</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">📈 Hour-by-Hour Activity</div>
        <div class="card-body">
          <div class="hour-bars">${hourMap.map((v,i)=>{const max=Math.max(...hourMap,1);const h=Math.round((v/max)*76);return`<div class="hour-bar" style="height:${h}px" title="${i}:00 — ${v} msgs"></div>`;}).join('')}</div>
          <div class="hour-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>
        </div>
      </div>
      ${topEmojis.length?`<div class="card">
        <div class="card-header">😄 Your Most Used Emojis</div>
        <div class="card-body"><div class="emoji-grid">${topEmojis.map(([e,c])=>`<div class="emoji-item"><span class="emoji-icon">${e}</span><span class="emoji-count">${c}</span></div>`).join('')}</div></div>
      </div>`:''}
    `;
  }catch(e){
    document.getElementById('loading').textContent='Could not load insights. Please try again.';
  }
}
</script>

<script>
(function(){
  window.toggleDark = function() {
    if (typeof window.setThemeMode === 'function') {
      var currentMode = window.getThemeMode();
      var currentTheme = currentMode === "system" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : currentMode;
      var nextMode = currentTheme === "dark" ? "light" : "dark";
      window.setThemeMode(nextMode);
    }
  };
})();
</script>
<script type="module" src="app-subpage.js"></script>
</body>
</html>
