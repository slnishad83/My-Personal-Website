<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Password — NSL Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .reset-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .reset-card .icon-wrap {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(0, 191, 165, 0.12);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .reset-card .icon-wrap .material-symbols-outlined { font-size: 32px; color: #00bfa5; }
    .reset-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .reset-card .subtitle { font-size: 13px; color: #8b949e; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1.5px solid #30363d; background: #0d1117; color: #e6edf3;
      font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #00bfa5; }
    .form-group input.error { border-color: #f85149; }
    .pw-strength { display: flex; gap: 4px; margin-top: 6px; }
    .pw-strength .bar { height: 3px; flex: 1; border-radius: 2px; background: #30363d; transition: background 0.2s; }
    .pw-strength .bar.weak { background: #f85149; }
    .pw-strength .bar.medium { background: #d29922; }
    .pw-strength .bar.strong { background: #00bfa5; }
    .submit-btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: #00bfa5; color: #0d1117; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .submit-btn .material-symbols-outlined.animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message { padding: 12px; border-radius: 10px; font-size: 13px; margin-top: 12px; display: none; }
    .message.success { display: block; background: rgba(0,191,165,0.1); color: #00bfa5; border: 1px solid rgba(0,191,165,0.25); }
    .message.error { display: block; background: rgba(248,81,73,0.1); color: #f85149; border: 1px solid rgba(248,81,73,0.25); }
    .loading-state { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 40px 0; color: #8b949e; font-size: 14px; }
    .loading-state .material-symbols-outlined.animate-spin { animation: spin 1s linear infinite; color: #00bfa5; }
    .back-link { display: inline-block; margin-top: 20px; font-size: 13px; color: #8b949e; text-decoration: none; }
    .back-link:hover { color: #00bfa5; }
  </style>
  <script type="module" crossorigin src="./assets/reset-5gorHPOn.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/firebase-config-B1gHZycV.js">
</head>
<body>
  <a href="#resetPwForm" class="sr-only" id="skip-nav" style="position:fixed;top:-100px;left:8px;z-index:99999;padding:12px 24px;background:#00bfa5;color:#0d1117;border-radius:0 0 12px 12px;font-weight:700;font-size:14px;text-decoration:none;" onfocus="this.style.top='0'" onblur="this.style.top='-100px'">Skip to form</a>
  <main role="main" aria-label="Password reset">
  <div class="reset-card">
    <!-- Loading state: validating link -->
    <div id="loadingState" class="loading-state" role="status" aria-live="polite">
      <span class="material-symbols-outlined animate-spin" aria-hidden="true">progress_activity</span>
      <span>Validating reset link...</span>
    </div>

    <!-- Reset form (hidden until oobCode validated) -->
    <div id="resetFormWrap" style="display:none">
      <div class="icon-wrap">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <h1>Set New Password</h1>
      <p class="subtitle" id="emailDisplay"></p>

      <form id="resetPwForm" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" placeholder="Enter new password" autocomplete="new-password" minlength="8" required />
          <div class="pw-strength" id="pwStrength">
            <div class="bar" id="bar1"></div>
            <div class="bar" id="bar2"></div>
            <div class="bar" id="bar3"></div>
            <div class="bar" id="bar4"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Re-enter new password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="submit-btn" id="resetSubmitBtn">
          <span class="material-symbols-outlined" style="font-size:20px" aria-hidden="true">verified_user</span>
          Reset Password
        </button>
      </form>

      <div id="resetMessage" class="message" role="alert" aria-live="assertive"></div>
    </div>

    <!-- Error state: invalid/expired link -->
    <div id="errorState" style="display:none" role="alert" aria-live="assertive">
      <div class="icon-wrap" style="background:rgba(248,81,73,0.12)">
        <span class="material-symbols-outlined" style="color:#f85149" aria-hidden="true">error</span>
      </div>
      <h1>Link Expired or Invalid</h1>
      <p class="subtitle" id="errorMessage">This password reset link has expired or is invalid. Please request a new one.</p>
      <a href="login.html" class="back-link">Back to Login</a>
    </div>
  </div>
  </main>

  <style>
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }
    *:focus-visible { outline: 2px solid #00bfa5 !important; outline-offset: 2px !important; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
</body>
</html>
