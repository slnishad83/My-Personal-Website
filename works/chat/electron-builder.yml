appId: com.nishad.myteamchat
productName: NSL Chat
copyright: Copyright © 2026 Nishad SL

directories:
  output: dist-electron
  buildResources: electron/build-resources

files:
  - electron/**/*
  - dist/**/*
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.{md,txt,ts}"
  - "!**/*.map"

asar: true

win:
  icon: dist/app-icon-512.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NSL Chat
  artifactName: "${productName}-${version}-Setup.${ext}"

portable:
  artifactName: "${productName}-${version}-Portable.${ext}"

mac:
  icon: dist/app-icon-512.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking

linux:
  icon: dist/app-icon-512.png
  maintainer: Nishad SL
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Chat

appImage:
  artifactName: "${productName}-${version}.${ext}"

deb:
  artifactName: "${productName}-${version}.${ext}"
