<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5"/>
  <meta name="theme-color" content="#11131c"/>
  <meta name="color-scheme" content="light dark"/>
  <meta name="description" content="NSL Chat — You are currently offline"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:;">
  <title>NSL Chat — Offline</title>
  <link rel="manifest" href="manifest.json"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d0f;color:#e2e4e9;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:20px;text-align:center}
    .offline-card{max-width:360px;width:100%}
    .offline-icon{width:64px;height:64px;border-radius:16px;margin-bottom:16px}
    .offline-icon-fallback{font-size:64px;margin-bottom:16px;opacity:.7}
    h1{font-size:20px;font-weight:700;margin-bottom:8px;color:#fff}
    p{font-size:14px;color:#8d92a0;line-height:1.5;margin-bottom:24px}
    .retry-btn{display:inline-block;padding:12px 32px;border-radius:12px;background:linear-gradient(135deg,#008069,#00a884);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;text-decoration:none;transition:transform .15s}
    .retry-btn:active{transform:scale(.97)}
    .retry-btn:focus-visible{outline:2px solid #00a884;outline-offset:2px}
    .countdown{font-size:13px;color:#575b66;margin-top:12px}
    .cached-note{font-size:12px;color:#575b66;margin-top:16px}
    .noscript{padding:40px 20px;text-align:center}
    .noscript h2{font-size:18px;margin-bottom:8px;color:#fff}
    .noscript p{font-size:14px;color:#8d92a0}
    @media (prefers-color-scheme: light) {
      body{background:#f0f2f5;color:#1b1b1f}
      h1,h2{color:#111}
      p{color:#667781}
      .countdown,.cached-note{color:#8696a0}
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <noscript>
    <div class="noscript">
      <h2>JavaScript Required</h2>
      <p>NSL Chat requires JavaScript to run. Please enable it in your browser settings.</p>
    </div>
  </noscript>
  <div class="offline-card" role="status" aria-live="polite">
    <img class="offline-icon" src="app-icon-192.png" alt="NSL Chat" width="64" height="64" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
    <div class="offline-icon-fallback" style="display:none" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>NSL Chat needs an internet connection to load. Check your connection and try again.</p>
    <button class="retry-btn" id="retryBtn" aria-label="Retry connection">Try again</button>
    <div class="countdown" id="countdown" aria-live="polite"></div>
    <p class="cached-note">If you were already using the app, cached messages may still be available.</p>
  </div>
  <script>
    (function() {
      var seconds = 30;
      var countdownEl = document.getElementById('countdown');
      var retryBtn = document.getElementById('retryBtn');
      var timer = setInterval(function() {
        seconds--;
        if (seconds <= 0) {
          clearInterval(timer);
          if (navigator.onLine) {
            location.reload();
          } else {
            countdownEl.textContent = 'Still offline. Tap to retry.';
          }
          return;
        }
        countdownEl.textContent = 'Retrying in ' + seconds + 's...';
      }, 1000);
      retryBtn.addEventListener('click', function() {
        clearInterval(timer);
        if (navigator.onLine) {
          location.reload();
        } else {
          countdownEl.textContent = 'Still offline. Retrying...';
          seconds = 0;
          setTimeout(function() { location.reload(); }, 1000);
        }
      });
      window.addEventListener('online', function() {
        clearInterval(timer);
        countdownEl.textContent = 'Connection restored! Reloading...';
        setTimeout(function() { location.reload(); }, 1500);
      });
    })();
  </script>
</body>
</html>
