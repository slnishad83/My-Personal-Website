<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/reset.html" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Redirecting to Reset</title>
  <script>
    var loc = location.href.replace(location.origin, "");
    location.replace(location.origin + "/reset.html?return=" + encodeURIComponent(location.origin + loc.replace(/\/reset(?:\.html)?\/?$/, "")));
  </script>
</head>
<body>
  <p><a href="/reset.html">Continue to full reset</a></p>
</body>
</html>
