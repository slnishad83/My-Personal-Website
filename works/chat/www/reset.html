<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="refresh" content="0;url=login.html" />
  <title>Reset Redirect</title>
  <script>
    (function () {
      var parentPath = location.pathname.replace(/\/reset(?:\.html)?\/?$/, "") || "/";
      var target = location.origin + "/login.html";
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="login.html">login page</a>...</p>
</body>
</html>
