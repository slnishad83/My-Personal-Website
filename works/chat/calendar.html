<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#008069"/>
  <title>Family Calendar — Team Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--green:#008069;--bg:#f0f2f5;--card:#fff;--text:#111b21;--muted:#667781;--border:#e2e8f0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .header{background:var(--green);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
    .back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px}
    .header h1{font-size:17px;font-weight:700;flex:1}
    .add-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .content{padding:16px;max-width:680px;margin:0 auto}
    .month-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:12px}
    .month-nav button{background:var(--card);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
    .month-nav h2{font-size:17px;font-weight:700}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
    .day-header{background:var(--bg);text-align:center;padding:8px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
    .day-cell{background:var(--card);min-height:70px;padding:6px;cursor:pointer;transition:background 0.15s;position:relative}
    .day-cell:hover{background:#f8fffe}
    .day-cell.other-month{background:#fafafa}
    .day-cell.today .day-num{background:var(--green);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
    .day-num{font-size:13px;font-weight:600;margin-bottom:3px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
    .day-cell.other-month .day-num{color:var(--muted)}
    .event-dot{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px;border-radius:3px;margin-bottom:1px;font-weight:500}
    .upcoming-card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
    .upcoming-header{padding:13px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px}
    .event-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
    .event-item:last-child{border-bottom:none}
    .event-date-box{width:44px;text-align:center;background:var(--bg);border-radius:8px;padding:6px 4px;flex-shrink:0}
    .event-day{font-size:18px;font-weight:800;color:var(--green);line-height:1}
    .event-month{font-size:10px;text-transform:uppercase;font-weight:700;color:var(--muted)}
    .event-body{flex:1}
    .event-title{font-weight:700;font-size:14px}
    .event-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .event-actions{display:flex;gap:6px}
    .btn-del-evt{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px}
    .empty-evt{text-align:center;padding:32px;color:var(--muted);font-size:14px}
    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
    .modal.show{display:flex}
    .modal-box{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px}
    .modal-box h3{font-size:17px;font-weight:700;margin-bottom:16px}
    .form-group{margin-bottom:13px}
    .form-group label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;outline:none}
    .form-group input:focus,.form-group select:focus{border-color:var(--green)}
    .modal-btns{display:flex;gap:10px;margin-top:16px}
    .btn-cancel{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
    .btn-save{flex:2;padding:11px;border:none;border-radius:9px;background:var(--green);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s}
    .toast.show{opacity:1}
    .color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.15s}
    .color-dot.selected{border-color:#111}
    @media(max-width:500px){.day-cell{min-height:50px}.event-dot{display:none}}
  </style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <h1>📅 Family Calendar</h1>
  <button class="add-btn" onclick="openModal()">+ Event</button>
</div>
<div class="content">
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <h2 id="monthTitle"></h2>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="calGrid">
    <div class="day-header">Sun</div><div class="day-header">Mon</div><div class="day-header">Tue</div>
    <div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div>
    <div class="day-header">Sat</div>
  </div>
  <div class="upcoming-card">
    <div class="upcoming-header">📌 Upcoming Events</div>
    <div id="upcomingList"><div class="empty-evt">Loading…</div></div>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="modal-box">
    <h3>Add Event</h3>
    <div class="form-group"><label>Title</label><input type="text" id="evtTitle" placeholder="e.g. Family dinner, Doctor appointment"/></div>
    <div class="form-group"><label>Date</label><input type="date" id="evtDate"/></div>
    <div class="form-group"><label>Time (optional)</label><input type="time" id="evtTime"/></div>
    <div class="form-group"><label>Note (optional)</label><input type="text" id="evtNote" placeholder="Any details…"/></div>
    <div class="form-group">
      <label>Colour</label>
      <div class="color-row" id="colorRow">
        <div class="color-dot selected" style="background:#008069" data-color="#008069" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#0284c7" data-color="#0284c7" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#7c3aed" data-color="#7c3aed" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#db2777" data-color="#db2777" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#d97706" data-color="#d97706" onclick="selectColor(this)"></div>
        <div class="color-dot" style="background:#dc2626" data-color="#dc2626" onclick="selectColor(this)"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCdbut_FdscAjl-OVSlAUhb7TOTiRNkh34",authDomain:"my-team-chat-2255.firebaseapp.com",projectId:"my-team-chat-2255",storageBucket:"my-team-chat-2255.firebasestorage.app",messagingSenderId:"805016891521",appId:"1:805016891521:web:ac9bc7a252bcf33686dd80"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,allEvents=[],viewDate=new Date(),selectedColor='#008069';
const today=new Date();

auth.onAuthStateChanged(u=>{if(!u){window.location.href='login.html';return;}currentUser=u;loadEvents();});

function loadEvents(){
  db.collection('calendarEvents').orderBy('date','asc').onSnapshot(snap=>{
    allEvents=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderCalendar();renderUpcoming();
  }, err=>{
    document.getElementById('upcomingList').innerHTML='<div class="empty-evt">Could not load events: '+err.message+'</div>';
  });
}

function changeMonth(dir){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+dir,1);renderCalendar();}

function renderCalendar(){
  const y=viewDate.getFullYear(),m=viewDate.getMonth();
  document.getElementById('monthTitle').textContent=viewDate.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const grid=document.getElementById('calGrid');
  // Keep headers
  const headers=Array.from(grid.querySelectorAll('.day-header'));
  grid.innerHTML='';
  headers.forEach(h=>grid.appendChild(h));
  // Fill blanks before first day
  for(let i=0;i<first.getDay();i++){const d=document.createElement('div');d.className='day-cell other-month';grid.appendChild(d);}
  // Days
  for(let d=1;d<=last.getDate();d++){
    const cell=document.createElement('div');
    cell.className='day-cell'+(isToday(y,m,d)?' today':'');
    const dayEvents=allEvents.filter(e=>e.date===`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    cell.innerHTML=`<div class="day-num">${d}</div>${dayEvents.slice(0,2).map(e=>`<div class="event-dot" style="background:${e.color||'#008069'}22;color:${e.color||'#008069'}">${esc(e.title)}</div>`).join('')}${dayEvents.length>2?`<div class="event-dot" style="color:var(--muted)">+${dayEvents.length-2} more</div>`:''}`;
    cell.onclick=()=>openModal(`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    grid.appendChild(cell);
  }
  // Fill end
  const lastDay=last.getDay();
  for(let i=lastDay+1;i<7;i++){const d=document.createElement('div');d.className='day-cell other-month';grid.appendChild(d);}
}

function renderUpcoming(){
  const todayStr=today.toISOString().split('T')[0];
  const upcoming=allEvents.filter(e=>e.date>=todayStr).slice(0,10);
  const el=document.getElementById('upcomingList');
  if(!upcoming.length){el.innerHTML='<div class="empty-evt">No upcoming events. Add one!</div>';return;}
  el.innerHTML=upcoming.map(e=>{
    const d=new Date(e.date+'T00:00:00');
    return`<div class="event-item">
      <div class="event-date-box"><div class="event-day">${d.getDate()}</div><div class="event-month">${d.toLocaleDateString('en',{month:'short'})}</div></div>
      <div class="event-body">
        <div class="event-title" style="color:${e.color||'var(--green)'}">${esc(e.title)}</div>
        <div class="event-meta">${e.time?e.time+' · ':''}${esc(e.note||'')} · Added by ${esc(e.addedByName||'Someone')}</div>
      </div>
      ${e.addedBy===currentUser.uid?`<div class="event-actions"><button class="btn-del-evt" onclick="deleteEvent('${e.id}')">🗑</button></div>`:''}
    </div>`;
  }).join('');
}

function openModal(dateStr){
  document.getElementById('evtTitle').value='';
  document.getElementById('evtDate').value=dateStr||today.toISOString().split('T')[0];
  document.getElementById('evtTime').value='';
  document.getElementById('evtNote').value='';
  selectedColor='#008069';
  document.querySelectorAll('.color-dot').forEach(d=>{d.classList.toggle('selected',d.dataset.color==='#008069');});
  document.getElementById('addModal').classList.add('show');
}
function closeModal(){document.getElementById('addModal').classList.remove('show');}
function selectColor(el){selectedColor=el.dataset.color;document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected'));el.classList.add('selected');}

async function saveEvent(){
  const title=document.getElementById('evtTitle').value.trim();
  const date=document.getElementById('evtDate').value;
  if(!title||!date){showToast('Enter title and date');return;}
  const userDoc=await db.collection('users').doc(currentUser.uid).get();
  const name=(userDoc.data()||{}).displayName||currentUser.email;
  await db.collection('calendarEvents').add({title,date,time:document.getElementById('evtTime').value||'',note:document.getElementById('evtNote').value.trim(),color:selectedColor,addedBy:currentUser.uid,addedByName:name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  closeModal();showToast('Event added!');
}

async function deleteEvent(id){if(!confirm('Delete this event?'))return;await db.collection('calendarEvents').doc(id).delete();showToast('Deleted');}

function isToday(y,m,d){return y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
