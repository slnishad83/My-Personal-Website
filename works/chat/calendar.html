  <style>
    :root{--green:#008069}
    body{background:var(--bg)}
    .app-header .header-action{background:rgba(255,255,255,0.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all 0.2s}
    .app-header .header-action:hover{background:rgba(255,255,255,0.25)}
    .content{padding:16px;max-width:680px;margin:0 auto}
    .month-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:12px}
    .month-nav button{background:var(--card);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text)}
    .month-nav h2{font-size:17px;font-weight:700}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
    .day-header{background:var(--bg);text-align:center;padding:8px 4px;font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase}
    .day-cell{background:var(--card);min-height:70px;padding:6px;cursor:pointer;transition:background 0.15s;position:relative}
    .day-cell:hover{background:var(--brand-soft)}
    .day-cell.other-month{background:var(--bg)}
    .day-cell.today .day-num{background:var(--brand);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
    .day-num{font-size:13px;font-weight:600;margin-bottom:3px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
    .day-cell.other-month .day-num{color:var(--text-secondary)}
    .event-dot{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px;border-radius:3px;margin-bottom:1px;font-weight:500}
    .upcoming-card{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
    .upcoming-header{padding:13px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px}
    .event-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
    .event-item:last-child{border-bottom:none}
    .event-date-box{width:44px;text-align:center;background:var(--bg);border-radius:8px;padding:6px 4px;flex-shrink:0}
    .event-day{font-size:18px;font-weight:800;color:var(--brand);line-height:1}
    .event-month{font-size:10px;text-transform:uppercase;font-weight:700;color:var(--text-secondary)}
    .event-body{flex:1}
    .event-title{font-weight:700;font-size:14px}
    .event-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .event-actions{display:flex;gap:6px}
    .btn-del-evt{background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:15px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
    .empty-evt{text-align:center;padding:32px;color:var(--text-secondary);font-size:14px}
    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;z-index:1000}
    .modal.show{display:flex}
    .modal-box{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px}
    .modal-box h3{font-size:17px;font-weight:700;margin-bottom:16px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s}
    .toast.show{opacity:1}
    .color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .color-dot{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.15s}
    .color-dot.selected{border-color:var(--text)}
    @media(max-width:500px){.day-cell{min-height:50px}.event-dot{width:4px;height:4px}}
    .btn-cancel{padding:8px 16px;border-radius:8px;border:1px solid var(--outline,#5f6368);background:transparent;color:var(--on-surface,#e1e1e6);cursor:pointer;font-size:14px;transition:opacity 0.2s}
    .btn-cancel:hover{opacity:0.8}
    .btn-save{padding:8px 16px;border-radius:8px;border:none;background:var(--primary,#6750A4);color:var(--on-primary,#fff);cursor:pointer;font-size:14px;font-weight:500;transition:opacity 0.2s}
    .btn-save:hover{opacity:0.85}

    /* Event styling fixes for dark mode */
    body.dark .event-dot {
      background: rgba(255, 255, 255, 0.08) !important;
      color: var(--text) !important;
      border-left: 3px solid var(--event-color, var(--brand)) !important;
      padding-left: 4px !important;
    }
    body.dark .event-title {
      color: var(--text) !important;
      border-left: 3.5px solid var(--event-color, var(--brand)) !important;
      padding-left: 8px !important;
    }
  </style>

<body>
<main role="main" aria-label="Family Calendar">
<div class="app-header">
  <button class="back-btn" onclick="history.back()" aria-label="Go back"><span class="mat-icon">arrow_back</span></button>
  <button class="header-action" id="darkToggleBtn" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode"><span class="mat-icon">dark_mode</span></button>
  <h1><span class="mat-icon mat-icon--sm" style="margin-right:6px">calendar_month</span> Family Calendar</h1>
  <button class="header-action" onclick="openModal()" title="Add event" aria-label="Add event"><span class="mat-icon">add</span></button>
</div>
<div class="content">
  <div class="month-nav">
    <button onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
    <h2 id="monthTitle"></h2>
    <button onclick="changeMonth(1)" aria-label="Next month">›</button>
  </div>
  <div class="cal-grid" id="calGrid">
    <div class="day-header">Sun</div><div class="day-header">Mon</div><div class="day-header">Tue</div>
    <div class="day-header">Wed</div><div class="day-header">Thu</div><div class="day-header">Fri</div>
    <div class="day-header">Sat</div>
  </div>
  <div class="upcoming-card">
    <div class="upcoming-header">📌 Upcoming Events</div>
    <div id="upcomingList"><div class="empty-evt">Loading…</div></div>
  </div>
</div>

<div class="modal" id="addModal">
  <div class="modal-box">
    <h3>Add Event</h3>
    <div class="form-group"><label for="evtTitle">Title</label><input type="text" id="evtTitle" placeholder="e.g. Family dinner, Doctor appointment"/></div>
    <div class="form-group"><label for="evtDate">Date</label><input type="date" id="evtDate"/></div>
    <div class="form-group"><label for="evtTime">Time (optional)</label><input type="time" id="evtTime"/></div>
    <div class="form-group"><label for="evtNote">Note (optional)</label><input type="text" id="evtNote" placeholder="Any details…"/></div>
    <div class="form-group">
      <label>Colour</label>
      <div class="color-row" id="colorRow">
        <div class="color-dot selected" style="background:#008069" data-color="#008069" onclick="selectColor(this)" role="button" tabindex="0" aria-label="Green"></div>
        <div class="color-dot" style="background:#0284c7" data-color="#0284c7" onclick="selectColor(this)" role="button" tabindex="0" aria-label="Blue"></div>
        <div class="color-dot" style="background:#7c3aed" data-color="#7c3aed" onclick="selectColor(this)" role="button" tabindex="0" aria-label="Purple"></div>
        <div class="color-dot" style="background:#db2777" data-color="#db2777" onclick="selectColor(this)" role="button" tabindex="0" aria-label="Pink"></div>
        <div class="color-dot" style="background:#d97706" data-color="#d97706" onclick="selectColor(this)" role="button" tabindex="0" aria-label="Orange"></div>
        <div class="color-dot" style="background:#dc2626" data-color="#dc2626" onclick="selectColor(this)" role="button" tabindex="0" aria-label="Red"></div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEvent()">Save Event</button>
    </div>
  </div>
</div>
</main>
<div class="toast" id="toast"></div>

<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
  <a class="nav-item" href="index.html" aria-label="Chat"><span class="mat-icon">chat</span><span>Chat</span></a>

  <a class="nav-item active" href="calendar.html" aria-current="page" aria-label="Calendar"><span class="mat-icon">calendar_month</span><span>Calendar</span></a>
  <a class="nav-item" href="expenses.html" aria-label="Expenses"><span class="mat-icon">receipt_long</span><span>Expenses</span></a>
  <a class="nav-item" href="insights.html" aria-label="Insights"><span class="mat-icon">insights</span><span>Insights</span></a>
</nav>

<script>
const firebaseConfig = window.FIREBASE_CONFIG;
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,allEvents=[],viewDate=new Date(),selectedColor='#008069';
const today=new Date();

auth.onAuthStateChanged(u=>{if(!u){var p=location.pathname.toLowerCase();if(!p.includes('login'))window.location.href=new URL('login.html',window.location.href).href;return;}currentUser=u;loadEvents();});

function loadEvents(){
  db.collection('calendarEvents').orderBy('date','asc').onSnapshot(snap=>{
    allEvents=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderCalendar();renderUpcoming();
  }, err=>{
    document.getElementById('upcomingList').innerHTML='<div class="empty-evt">Could not load events: '+esc(err.message)+'</div>';
  });
}

function changeMonth(dir){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+dir,1);renderCalendar();}

function renderCalendar(){
  const y=viewDate.getFullYear(),m=viewDate.getMonth();
  document.getElementById('monthTitle').textContent=viewDate.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const grid=document.getElementById('calGrid');
  // Keep headers
  const headers=Array.from(grid.querySelectorAll('.day-header'));
  grid.innerHTML='';
  headers.forEach(h=>grid.appendChild(h));
  // Fill blanks before first day
  for(let i=0;i<first.getDay();i++){const d=document.createElement('div');d.className='day-cell other-month';grid.appendChild(d);}
  // Days
  for(let d=1;d<=last.getDate();d++){
    const cell=document.createElement('div');
    cell.className='day-cell'+(isToday(y,m,d)?' today':'');
    const dayEvents=allEvents.filter(e=>e.date===`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    cell.innerHTML=`<div class="day-num">${d}</div>${dayEvents.slice(0,2).map(e=>{const c=(e.color||'#008069').replace(/[^#0-9a-fA-F]/g,'').slice(0,7);return`<div class="event-dot" style="background:${c}22;color:${c};--event-color:${c}">${esc(e.title)}</div>`}).join('')}${dayEvents.length>2?`<div class="event-dot" style="color:var(--text-secondary)">+${dayEvents.length-2} more</div>`:''}`;
    cell.onclick=()=>openModal(`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
    cell.setAttribute('role','button');
    cell.setAttribute('tabindex','0');
    cell.setAttribute('aria-label',`Day ${d}`);
    cell.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cell.click();}};
    grid.appendChild(cell);
  }
  // Fill end
  const lastDay=last.getDay();
  for(let i=lastDay+1;i<7;i++){const d=document.createElement('div');d.className='day-cell other-month';grid.appendChild(d);}
}

function renderUpcoming(){
  const todayStr=today.toISOString().split('T')[0];
  const upcoming=allEvents.filter(e=>e.date>=todayStr).slice(0,10);
  const el=document.getElementById('upcomingList');
  if(!upcoming.length){el.innerHTML='<div class="empty-evt">No upcoming events. Add one!</div>';return;}
  el.innerHTML=upcoming.map(e=>{
    const d=new Date(e.date+'T00:00:00');
    return`<div class="event-item">
      <div class="event-date-box"><div class="event-day">${d.getDate()}</div><div class="event-month">${d.toLocaleDateString('en',{month:'short'})}</div></div>
      <div class="event-body">
        <div class="event-title" style="color:${(e.color||'var(--brand)').replace(/[^#0-9a-fA-F()%,.\-]/g,'').slice(0,40)};--event-color:${(e.color||'#008069').replace(/[^#0-9a-fA-F]/g,'').slice(0,7)}">${esc(e.title)}</div>
        <div class="event-meta">${e.time?e.time+' · ':''}${esc(e.note||'')} · Added by ${esc(e.addedByName||'Someone')}</div>
      </div>
      ${e.addedBy===currentUser.uid?`<div class="event-actions"><button class="btn-del-evt" onclick="deleteEvent('${e.id}')" aria-label="Delete event">🗑</button></div>`:''}
    </div>`;
  }).join('');
}

function openModal(dateStr){
  document.getElementById('evtTitle').value='';
  document.getElementById('evtDate').value=dateStr||today.toISOString().split('T')[0];
  document.getElementById('evtTime').value='';
  document.getElementById('evtNote').value='';
  selectedColor='#008069';
  document.querySelectorAll('.color-dot').forEach(d=>{d.classList.toggle('selected',d.dataset.color==='#008069');});
  document.getElementById('addModal').classList.add('show');
}
function closeModal(){document.getElementById('addModal').classList.remove('show');}
function selectColor(el){selectedColor=el.dataset.color;document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected'));el.classList.add('selected');}

async function saveEvent(){
  const title=document.getElementById('evtTitle').value.trim();
  const date=document.getElementById('evtDate').value;
  if(!title||!date){showToast('Enter title and date');return;}
  const userDoc=await db.collection('users').doc(currentUser.uid).get();
  const name=(userDoc.data()||{}).displayName||currentUser.email;
  await db.collection('calendarEvents').add({title,date,time:document.getElementById('evtTime').value||'',note:document.getElementById('evtNote').value.trim(),color:selectedColor,addedBy:currentUser.uid,addedByName:name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  closeModal();showToast('Event added!');
}

async function deleteEvent(id){if(!confirm('Delete this event?'))return;await db.collection('calendarEvents').doc(id).delete();showToast('Deleted');}

function isToday(y,m,d){return y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}
</script>

<script>
(function(){
  window.toggleDark = function() {
    if (typeof window.setThemeMode === 'function') {
      var currentMode = window.getThemeMode();
      var currentTheme = currentMode === "system" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : currentMode;
      var nextMode = currentTheme === "dark" ? "light" : "dark";
      window.setThemeMode(nextMode);
    }
  };
})();
</script>
</body>
