<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#008069"/>
  <title>Expense Splitter — Team Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--green:#008069;--red:#ef4444;--bg:#f0f2f5;--card:#fff;--text:#111b21;--muted:#667781;--border:#e2e8f0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .header{background:var(--green);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
    .back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px}
    .header h1{font-size:17px;font-weight:700;flex:1}
    .add-btn{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .content{padding:16px;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
    .group-selector{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px}
    .group-selector label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
    .group-selector select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;outline:none}
    .group-selector select:focus{border-color:var(--green)}
    .summary-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
    .summary-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px}
    .balance-row{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border);font-size:13px}
    .balance-row:last-child{border-bottom:none}
    .balance-name{font-weight:600}
    .balance-amt.owed{color:var(--red);font-weight:700}
    .balance-amt.owes{color:var(--green);font-weight:700}
    .balance-amt.settled{color:var(--muted)}
    .expense-list{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden}
    .expense-item{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
    .expense-item:last-child{border-bottom:none}
    .expense-icon{width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .expense-info{flex:1}
    .expense-desc{font-weight:600;font-size:14px}
    .expense-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .expense-amt{font-weight:700;font-size:15px;color:var(--text)}
    .expense-paid{font-size:11px;color:var(--muted)}
    .btn-delete-exp{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
    .empty{text-align:center;padding:40px;color:var(--muted)}
    .empty .icon{font-size:40px;display:block;margin-bottom:10px}

    /* Modal */
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000;display:none}
    .modal.show{display:flex}
    .modal-box{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
    .modal-box h3{font-size:17px;font-weight:700;margin-bottom:18px}
    .form-group{margin-bottom:14px}
    .form-group label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;outline:none}
    .form-group input:focus,.form-group select:focus{border-color:var(--green)}
    .split-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
    .split-row:last-child{border-bottom:none}
    .split-name{font-size:13px;font-weight:600}
    .split-share{font-size:13px;color:var(--muted)}
    .modal-btns{display:flex;gap:10px;margin-top:18px}
    .btn-cancel{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
    .btn-save{flex:2;padding:11px;border:none;border-radius:9px;background:var(--green);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.3s}
    .toast.show{opacity:1}
    .cat-emojis{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .cat-emoji{font-size:22px;cursor:pointer;padding:4px;border-radius:6px;border:2px solid transparent}
    .cat-emoji.selected{border-color:var(--green)}
  
    /* ── DARK MODE ─────────────────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b141a;--card:#111b21;--text:#e9edef;--muted:#8696a0;--border:#2a3942 }
    }
    body.dark { --bg:#0b141a;--card:#111b21;--text:#e9edef;--muted:#8696a0;--border:#2a3942 }
    body.dark .group-selector select,
    body.dark .modal-box,
    body.dark .btn-cancel,
    body.dark .form-group input,
    body.dark .form-group select,
    body.dark .form-group textarea { background:var(--card);color:var(--text);border-color:var(--border) }
    body.dark .form-group input:focus,
    body.dark .form-group select:focus { border-color:#00a884 }
  </style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <h1>💰 Expense Splitter</h1>
  <button class="add-btn" onclick="openModal()">+ Add</button>
</div>
<div class="content">
  <div class="group-selector">
    <label>Select Group</label>
    <select id="groupSelect" onchange="loadExpenses()">
      <option value="">Loading groups…</option>
    </select>
  </div>
  <div class="summary-card" id="summaryCard" style="display:none">
    <div class="summary-header">💸 Who Owes Who</div>
    <div id="balances"></div>
  </div>
  <div class="expense-list" id="expenseList">
    <div class="empty"><span class="icon">💰</span>Select a group to see expenses</div>
  </div>
</div>

<!-- Add Expense Modal -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <h3>Add Expense</h3>
    <div class="form-group">
      <label>What for?</label>
      <input type="text" id="expDesc" placeholder="e.g. Dinner, Groceries, Movie tickets"/>
      <div class="cat-emojis" id="catEmojis">
        🍽️🛒🎬🚗⛽🏠🎁💊🛫🎉🏥☕
      </div>
    </div>
    <div class="form-group">
      <label>Total Amount (₹)</label>
      <input type="number" id="expAmt" placeholder="0.00" min="0" step="0.01"/>
    </div>
    <div class="form-group">
      <label>Paid by</label>
      <select id="expPaidBy"></select>
    </div>
    <div class="form-group">
      <label>Split between</label>
      <div id="splitMembers"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveExpense()">Add Expense</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyCdbut_FdscAjl-OVSlAUhb7TOTiRNkh34",authDomain:"my-team-chat-2255.firebaseapp.com",projectId:"my-team-chat-2255",storageBucket:"my-team-chat-2255.firebasestorage.app",messagingSenderId:"805016891521",appId:"1:805016891521:web:ac9bc7a252bcf33686dd80"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,groups=[],members=[],selectedIcon='💰',currentExpenses=[];

auth.onAuthStateChanged(u=>{if(!u){window.location.href='login.html';return;}currentUser=u;loadGroups();});

async function loadGroups(){
  const snap=await db.collection('groups').get();
  groups=snap.docs.map(d=>({id:d.id,...d.data()})).filter(g=>g.memberIds&&g.memberIds.includes(currentUser.uid));
  const sel=document.getElementById('groupSelect');
  if(!groups.length){sel.innerHTML='<option>No groups found</option>';return;}
  sel.innerHTML=groups.map(g=>`<option value="${g.id}">${esc(g.name||'Group')}</option>`).join('');
  loadExpenses();
}

async function loadExpenses(){
  const gid=document.getElementById('groupSelect').value;
  if(!gid)return;
  const g=groups.find(x=>x.id===gid);
  if(!g)return;
  // Load group members
  const memberSnap=await db.collection('groupMembers').where('groupId','==',gid).get();
  const memberIds=[...new Set(memberSnap.docs.map(d=>d.data().userId))];
  if(g.memberIds)memberIds.push(...g.memberIds.filter(id=>!memberIds.includes(id)));
  const userSnaps=await Promise.all([...new Set(memberIds)].map(id=>db.collection('users').doc(id).get()));
  members=userSnaps.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
  // Load expenses
  const expSnap=await db.collection('groupExpenses').where('groupId','==',gid).orderBy('createdAt','desc').limit(100).get();
  currentExpenses=expSnap.docs.map(d=>({id:d.id,...d.data()}));
  renderExpenses();
  renderBalances();
}

function renderExpenses(){
  const el=document.getElementById('expenseList');
  if(!currentExpenses.length){el.innerHTML='<div class="empty"><span class="icon">💸</span>No expenses yet. Add the first one!</div>';return;}
  el.innerHTML=currentExpenses.map(e=>{
    const paidByUser=members.find(m=>m.id===e.paidBy);
    const d=e.createdAt?.toDate?e.createdAt.toDate():new Date();
    return`<div class="expense-item">
      <div class="expense-icon">${e.icon||'💰'}</div>
      <div class="expense-info">
        <div class="expense-desc">${esc(e.description)}</div>
        <div class="expense-meta">${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} · Split ${e.splitCount||1} ways</div>
      </div>
      <div>
        <div class="expense-amt">₹${(e.amount||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="expense-paid">Paid by ${esc(paidByUser?.displayName||'Unknown')}</div>
      </div>
      ${e.addedBy===currentUser.uid?`<button class="btn-delete-exp" onclick="deleteExpense('${e.id}')">🗑</button>`:''}
    </div>`;
  }).join('');
}

function renderBalances(){
  const balances={};
  members.forEach(m=>{balances[m.id]={name:m.displayName||m.email,paid:0,share:0};});
  currentExpenses.forEach(e=>{
    const splitIds=e.splitAmong||[];
    const share=(e.amount||0)/Math.max(splitIds.length,1);
    if(balances[e.paidBy])balances[e.paidBy].paid+=(e.amount||0);
    splitIds.forEach(uid=>{if(balances[uid])balances[uid].share+=share;});
  });
  const rows=Object.entries(balances).map(([id,b])=>({id,name:b.name,net:b.paid-b.share}));
  document.getElementById('summaryCard').style.display='block';
  document.getElementById('balances').innerHTML=rows.map(r=>{
    const cls=r.net>0.01?'owes':r.net<-0.01?'owed':'settled';
    const label=r.net>0.01?`gets back ₹${r.net.toFixed(2)}`:r.net<-0.01?`owes ₹${Math.abs(r.net).toFixed(2)}`:'Settled up';
    return`<div class="balance-row"><span class="balance-name">${esc(r.name)}</span><span class="balance-amt ${cls}">${label}</span></div>`;
  }).join('');
}

function openModal(){
  const gid=document.getElementById('groupSelect').value;
  if(!gid){showToast('Select a group first');return;}
  document.getElementById('expDesc').value='';
  document.getElementById('expAmt').value='';
  selectedIcon='💰';
  // Populate paid by
  document.getElementById('expPaidBy').innerHTML=members.map(m=>`<option value="${m.id}"${m.id===currentUser.uid?' selected':''}>${esc(m.displayName||m.email)}</option>`).join('');
  // Split checkboxes
  document.getElementById('splitMembers').innerHTML=members.map(m=>`<div class="split-row"><span class="split-name">${esc(m.displayName||m.email)}</span><input type="checkbox" value="${m.id}" checked/></div>`).join('');
  // Emoji picker
  const expIcons=['🍽','🛒','🎬','🚗','⛽','🏠','🎁','💊','🛫','🎉','🏥','☕','🍕','🎮','💪','🐕','📚','✈','🎵','🎤','💻','🧾'];document.getElementById('catEmojis').innerHTML=expIcons.map(e=>`<span class="cat-emoji" onclick="selectIcon('${e}',this)">${e}</span>`).join('');
  document.getElementById('addModal').classList.add('show');
}
function closeModal(){document.getElementById('addModal').classList.remove('show');}
function selectIcon(e,el){selectedIcon=e;document.querySelectorAll('.cat-emoji').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');}

async function saveExpense(){
  const desc=document.getElementById('expDesc').value.trim();
  const amt=parseFloat(document.getElementById('expAmt').value);
  const paidBy=document.getElementById('expPaidBy').value;
  const splitAmong=[...document.querySelectorAll('#splitMembers input:checked')].map(x=>x.value);
  if(!desc||!amt||!paidBy||!splitAmong.length){showToast('Fill in all fields');return;}
  const gid=document.getElementById('groupSelect').value;
  await db.collection('groupExpenses').add({groupId:gid,description:desc,amount:amt,paidBy,splitAmong,splitCount:splitAmong.length,icon:selectedIcon,addedBy:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  closeModal();
  showToast('Expense added!');
  loadExpenses();
}

async function deleteExpense(id){
  if(!confirm('Delete this expense?'))return;
  await db.collection('groupExpenses').doc(id).delete();
  showToast('Deleted');loadExpenses();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
