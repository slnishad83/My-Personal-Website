<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#008069"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: 'unsafe-inline'; script-src 'self' https://www.gstatic.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' https: blob: data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.cloudfunctions.net wss://*.firebaseio.com; frame-ancestors 'self'; form-action 'self';">
  <title>Family Album — Team Chat</title>
  <script>
    (function() {
      var mode = localStorage.getItem("themeMode") || (localStorage.getItem("darkMode") === "true" ? "dark" : "system");
      if (!localStorage.getItem("themeMode")) localStorage.setItem("themeMode", mode);
      var theme = mode === "system" ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
      document.documentElement.dataset.theme = theme;
      var css = 'body { visibility: hidden !important; }';
      var style = document.createElement('style');
      style.type = 'text/css';
      style.appendChild(document.createTextNode(css));
      document.head.appendChild(style);
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.toggle("dark", theme === "dark");
        style.remove();
      });
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="redesign-base.css" />
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--green:#008069}
    body{background:var(--bg)}
    .app-header .count{font-size:13px;opacity:0.8}
    .toolbar{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text-secondary);transition:all 0.15s}
    .filter-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .search-box{margin-left:auto;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:inherit;outline:none;width:180px;background:var(--card);color:var(--text)}
    .search-box:focus{border-color:var(--brand)}
    .album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px;padding:3px;width:100%}
    .photo-item{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--border)}
    .photo-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.2s}
    .photo-item:hover img{transform:scale(1.05)}
    .photo-meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.6));padding:20px 8px 8px;color:#fff;font-size:11px;opacity:0;transition:opacity 0.2s}
    .photo-item:hover .photo-meta{opacity:1}
    .photo-sender{font-weight:600;display:block}
    .photo-date{opacity:0.8}
    .month-header{grid-column:1/-1;padding:12px 8px 6px;font-size:13px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--text-secondary);gap:12px;width:100%;text-align:center;padding:24px}
    .empty .icon{font-size:48px}
    .loading{display:flex;align-items:center;justify-content:center;min-height:50vh;color:var(--text-secondary);font-size:14px}

    /* LIGHTBOX */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1000;display:none;flex-direction:column}
    .lightbox.show{display:flex}
    .lb-header{padding:14px 18px;display:flex;align-items:center;gap:12px;color:#fff}
    .lb-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
    .lb-info{flex:1}
    .lb-sender{font-weight:700;font-size:15px}
    .lb-date{font-size:12px;opacity:0.7}
    .lb-download{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
    .lb-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
    .lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .lb-prev{left:12px}
    .lb-next{right:12px}
    .lb-counter{text-align:center;color:rgba(255,255,255,0.6);font-size:13px;padding:10px}
    @media(max-width:600px){.album-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
  </style>
</head>
<body>
<main role="main" aria-label="Family Album">
<div class="app-header">
  <button class="back-btn" onclick="history.back()" aria-label="Go back"><span class="mat-icon">arrow_back</span></button>
  <button class="header-action" id="darkToggleBtn" onclick="toggleDark()" title="Toggle dark mode" aria-label="Toggle dark mode"><span class="mat-icon">dark_mode</span></button>
  <h1><span class="mat-icon mat-icon--sm" style="margin-right:6px">photo_library</span> Family Album</h1>
  <span class="count" id="photoCount">Loading…</span>
</div>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('image',this)">Photos</button>
  <button class="filter-btn" onclick="setFilter('video',this)">Videos</button>
  <input class="search-box" type="text" placeholder="Search by name…" id="searchInput" oninput="renderAlbum()" aria-label="Search photos"/>
</div>

<div id="albumGrid" class="album-grid"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lb-header">
    <button class="lb-close" onclick="closeLb()" aria-label="Close lightbox">✕</button>
    <div class="lb-info">
      <div class="lb-sender" id="lbSender"></div>
      <div class="lb-date" id="lbDate"></div>
    </div>
    <a class="lb-download" id="lbDownload" download target="_blank">⬇ Save</a>
  </div>
  <div class="lb-body">
    <button class="lb-nav lb-prev" onclick="navLb(-1)" aria-label="Previous photo">‹</button>
    <img class="lb-img" id="lbImg" src="" alt="Photo preview"/>
    <button class="lb-nav lb-next" onclick="navLb(1)" aria-label="Next photo">›</button>
  </div>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
const firebaseConfig = window.FIREBASE_CONFIG;
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

let currentUser=null,allPhotos=[],filtered=[],currentFilter='all',lbIndex=0;

auth.onAuthStateChanged(u=>{
  if(!u){window.location.href='login.html';return;}
  currentUser=u;
  loadAlbum();
});

async function loadAlbum(){
  document.getElementById('albumGrid').innerHTML='<div class="loading">Loading photos…</div>';
  try{
    const [imgSnap,vidSnap]=await Promise.all([
      db.collection('messages').where('participants','array-contains',currentUser.uid).where('attachment.type','==','image').orderBy('timestamp','desc').limit(300).get(),
      db.collection('messages').where('participants','array-contains',currentUser.uid).where('attachment.type','==','video').orderBy('timestamp','desc').limit(200).get()
    ]);
    const seen=new Set();
    allPhotos=[...imgSnap.docs,...vidSnap.docs]
      .map(d=>({id:d.id,...d.data()}))
      .filter(m=>{if(!m.attachment||!m.attachment.url||seen.has(m.id))return false;seen.add(m.id);return true;})
      .sort((a,b)=>{const ta=a.timestamp?.toMillis?a.timestamp.toMillis():0;const tb=b.timestamp?.toMillis?b.timestamp.toMillis():0;return tb-ta;});
    renderAlbum();
  }catch(e){
    document.getElementById('albumGrid').innerHTML='<div class="empty"><div class="icon">📷</div><p>Could not load album.<br>'+esc(e.message)+'</p></div>';
  }
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAlbum();
}

function renderAlbum(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  filtered=allPhotos.filter(m=>{
    const typeOk=currentFilter==='all'||(m.attachment&&m.attachment.type===currentFilter);
    const qOk=!q||(m.senderName||'').toLowerCase().includes(q);
    return typeOk&&qOk;
  });
  document.getElementById('photoCount').textContent=filtered.length+' items';
  if(!filtered.length){
    const emptyIcon = currentFilter==='video' ? '🎥' : '📷';
    const emptyMsg = currentFilter==='video'
      ? 'No videos yet. Share videos in any chat!'
      : currentFilter==='image'
        ? 'No photos yet. Share images in any chat!'
        : 'No media yet. Share photos or videos in any chat!';
    document.getElementById('albumGrid').innerHTML=`<div class="empty" style="grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;width:100%;text-align:center;"><div class="icon" style="font-size:56px;margin-bottom:16px">${emptyIcon}</div><p style="color:var(--text-secondary);font-size:15px;max-width:260px;line-height:1.5">${emptyMsg}</p></div>`;
    return;
  }
  // Group by month
  let html='',lastMonth='';
  filtered.forEach((m,i)=>{
    const d=m.timestamp?.toDate?m.timestamp.toDate():new Date();
    const month=d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    if(month!==lastMonth){html+=`<div class="month-header">${month}</div>`;lastMonth=month;}
    const isVideo=m.attachment.type==='video';
    html+=`<div class="photo-item" onclick="openLb(${i})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLb(${i})}">
      ${isVideo?`<video src="${esc(m.attachment.url)}" style="width:100%;height:100%;object-fit:cover"></video>`
        :`<img src="${esc(m.attachment.url)}" loading="lazy" alt="Shared photo"/>`}
      <div class="photo-meta">
        <span class="photo-sender">${esc(m.senderName||'Unknown')}</span>
        <span class="photo-date">${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</span>
      </div>
    </div>`;
  });
  document.getElementById('albumGrid').innerHTML=html;
}

function openLb(i){
  lbIndex=i;showLb();
  document.getElementById('lightbox').classList.add('show');
  document.addEventListener('keydown',lbKey);
}
function closeLb(){
  document.getElementById('lightbox').classList.remove('show');
  document.removeEventListener('keydown',lbKey);
}
function lbKey(e){if(e.key==='ArrowLeft')navLb(-1);else if(e.key==='ArrowRight')navLb(1);else if(e.key==='Escape')closeLb();}
function navLb(dir){lbIndex=Math.max(0,Math.min(filtered.length-1,lbIndex+dir));showLb();}
function showLb(){
  const m=filtered[lbIndex];
  document.getElementById('lbImg').src=m.attachment.url;
  document.getElementById('lbSender').textContent=m.senderName||'Unknown';
  const d=m.timestamp?.toDate?m.timestamp.toDate():new Date();
  document.getElementById('lbDate').textContent=d.toLocaleString('en-IN');
  document.getElementById('lbDownload').href=m.attachment.url;
  document.getElementById('lbCounter').textContent=(lbIndex+1)+' of '+filtered.length;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}
</script>
<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
  <a class="nav-item" href="index.html" aria-label="Chat"><span class="mat-icon">chat</span><span>Chat</span></a>
  <a class="nav-item active" href="album.html" aria-current="page" aria-label="Album"><span class="mat-icon">photo_library</span><span>Album</span></a>
  <a class="nav-item" href="calendar.html" aria-label="Calendar"><span class="mat-icon">calendar_month</span><span>Calendar</span></a>
  <a class="nav-item" href="expenses.html" aria-label="Expenses"><span class="mat-icon">receipt_long</span><span>Expenses</span></a>
  <a class="nav-item" href="insights.html" aria-label="Insights"><span class="mat-icon">insights</span><span>Insights</span></a>
</nav>

<script type="module" src="app-subpage.js"></script>
<script>
function toggleDark() {
  document.documentElement.classList.toggle('dark');
  const isDark = document.documentElement.classList.contains('dark');
  localStorage.setItem('nsl-theme', isDark ? 'dark' : 'light');
  document.querySelector('meta[name="theme-color"]').content = isDark ? '#11131c' : '#f8f9fa';
}
</script>
</body>
</html>
