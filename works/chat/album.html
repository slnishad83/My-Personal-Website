<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#008069"/>
  <title>Family Album — Team Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--green:#008069;--bg:#f0f2f5;--card:#fff;--text:#111b21;--muted:#667781;--border:#e2e8f0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .header{background:var(--green);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
    .back-btn{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px;line-height:1}
    .header h1{font-size:17px;font-weight:700;flex:1}
    .header .count{font-size:13px;opacity:0.8}
    .toolbar{padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted);transition:all 0.15s}
    .filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
    .search-box{margin-left:auto;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;font-family:inherit;outline:none;width:180px}
    .search-box:focus{border-color:var(--green)}
    .album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:3px;padding:3px}
    .photo-item{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:#e9edef}
    .photo-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.2s}
    .photo-item:hover img{transform:scale(1.05)}
    .photo-meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.6));padding:20px 8px 8px;color:#fff;font-size:11px;opacity:0;transition:opacity 0.2s}
    .photo-item:hover .photo-meta{opacity:1}
    .photo-sender{font-weight:600;display:block}
    .photo-date{opacity:0.8}
    .month-header{grid-column:1/-1;padding:12px 8px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;color:var(--muted);gap:12px}
    .empty .icon{font-size:48px}
    .loading{display:flex;align-items:center;justify-content:center;min-height:50vh;color:var(--muted);font-size:14px}

    /* LIGHTBOX */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1000;display:none;flex-direction:column}
    .lightbox.show{display:flex}
    .lb-header{padding:14px 18px;display:flex;align-items:center;gap:12px;color:#fff}
    .lb-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
    .lb-info{flex:1}
    .lb-sender{font-weight:700;font-size:15px}
    .lb-date{font-size:12px;opacity:0.7}
    .lb-download{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
    .lb-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
    .lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .lb-prev{left:12px}
    .lb-next{right:12px}
    .lb-counter{text-align:center;color:rgba(255,255,255,0.6);font-size:13px;padding:10px}
    @media(max-width:600px){.album-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
  </style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <h1>📸 Family Album</h1>
  <span class="count" id="photoCount">Loading…</span>
</div>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('image',this)">Photos</button>
  <button class="filter-btn" onclick="setFilter('video',this)">Videos</button>
  <input class="search-box" type="text" placeholder="Search by name…" id="searchInput" oninput="renderAlbum()"/>
</div>

<div id="albumGrid" class="album-grid"></div>

<div class="lightbox" id="lightbox">
  <div class="lb-header">
    <button class="lb-close" onclick="closeLb()">✕</button>
    <div class="lb-info">
      <div class="lb-sender" id="lbSender"></div>
      <div class="lb-date" id="lbDate"></div>
    </div>
    <a class="lb-download" id="lbDownload" download target="_blank">⬇ Save</a>
  </div>
  <div class="lb-body">
    <button class="lb-nav lb-prev" onclick="navLb(-1)">‹</button>
    <img class="lb-img" id="lbImg" src="" alt=""/>
    <button class="lb-nav lb-next" onclick="navLb(1)">›</button>
  </div>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyCdbut_FdscAjl-OVSlAUhb7TOTiRNkh34",authDomain:"my-team-chat-2255.firebaseapp.com",projectId:"my-team-chat-2255",storageBucket:"my-team-chat-2255.firebasestorage.app",messagingSenderId:"805016891521",appId:"1:805016891521:web:ac9bc7a252bcf33686dd80"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

let allPhotos=[],filtered=[],currentFilter='all',lbIndex=0;

auth.onAuthStateChanged(u=>{
  if(!u){window.location.href='login.html';return;}
  loadAlbum();
});

async function loadAlbum(){
  document.getElementById('albumGrid').innerHTML='<div class="loading">Loading photos…</div>';
  try{
    const snap=await db.collection('messages')
      .where('attachment.type','in',['image','video'])
      .orderBy('timestamp','desc').limit(500).get();
    allPhotos=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(m=>m.attachment&&m.attachment.url);
    renderAlbum();
  }catch(e){
    document.getElementById('albumGrid').innerHTML='<div class="empty"><div class="icon">📷</div><p>Could not load album.<br>'+e.message+'</p></div>';
  }
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAlbum();
}

function renderAlbum(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  filtered=allPhotos.filter(m=>{
    const typeOk=currentFilter==='all'||(m.attachment&&m.attachment.type===currentFilter);
    const qOk=!q||(m.senderName||'').toLowerCase().includes(q);
    return typeOk&&qOk;
  });
  document.getElementById('photoCount').textContent=filtered.length+' items';
  if(!filtered.length){
    document.getElementById('albumGrid').innerHTML='<div class="empty"><div class="icon">📷</div><p>No photos yet. Share images in any chat!</p></div>';
    return;
  }
  // Group by month
  let html='',lastMonth='';
  filtered.forEach((m,i)=>{
    const d=m.timestamp?.toDate?m.timestamp.toDate():new Date();
    const month=d.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    if(month!==lastMonth){html+=`<div class="month-header">${month}</div>`;lastMonth=month;}
    const isVideo=m.attachment.type==='video';
    html+=`<div class="photo-item" onclick="openLb(${i})">
      ${isVideo?`<video src="${m.attachment.url}" style="width:100%;height:100%;object-fit:cover"></video>`
        :`<img src="${m.attachment.url}" loading="lazy" alt=""/>`}
      <div class="photo-meta">
        <span class="photo-sender">${esc(m.senderName||'Unknown')}</span>
        <span class="photo-date">${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</span>
      </div>
    </div>`;
  });
  document.getElementById('albumGrid').innerHTML=html;
}

function openLb(i){
  lbIndex=i;showLb();
  document.getElementById('lightbox').classList.add('show');
  document.addEventListener('keydown',lbKey);
}
function closeLb(){
  document.getElementById('lightbox').classList.remove('show');
  document.removeEventListener('keydown',lbKey);
}
function lbKey(e){if(e.key==='ArrowLeft')navLb(-1);else if(e.key==='ArrowRight')navLb(1);else if(e.key==='Escape')closeLb();}
function navLb(dir){lbIndex=Math.max(0,Math.min(filtered.length-1,lbIndex+dir));showLb();}
function showLb(){
  const m=filtered[lbIndex];
  document.getElementById('lbImg').src=m.attachment.url;
  document.getElementById('lbSender').textContent=m.senderName||'Unknown';
  const d=m.timestamp?.toDate?m.timestamp.toDate():new Date();
  document.getElementById('lbDate').textContent=d.toLocaleString('en-IN');
  document.getElementById('lbDownload').href=m.attachment.url;
  document.getElementById('lbCounter').textContent=(lbIndex+1)+' of '+filtered.length;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
