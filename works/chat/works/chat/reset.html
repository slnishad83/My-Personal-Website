<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Team Chat</title>
  <link rel="stylesheet" href="auth-theme.css?v=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef2f3;
      --card: rgba(255, 255, 255, 0.92);
      --text: #132029;
      --muted: #5f6f79;
      --accent: #00a884;
      --border: rgba(19, 32, 41, 0.12);
    }
    html[data-theme="dark"] {
      --bg: #08131a;
      --card: rgba(16, 26, 33, 0.95);
      --text: #e9edef;
      --muted: #9aa7b2;
      --accent: #25d366;
      --border: rgba(233, 237, 239, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(0, 168, 132, 0.18), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(18px);
      padding: 28px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid color-mix(in srgb, var(--accent) 20%, transparent);
      border-top-color: var(--accent);
      margin: 0 auto 18px;
      animation: spin 0.9s linear infinite;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.7rem;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }
    .status {
      margin-top: 18px;
      font-size: 0.92rem;
      color: var(--muted);
      padding: 12px 14px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
      text-align: left;
      white-space: pre-line;
    }
    .btn {
      margin-top: 18px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-height: 46px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    .btn:disabled { opacity: 0.72; cursor: progress; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Resetting Team Chat</h1>
    <p>This clears browser and PWA state for the current device so the app can reload cleanly.</p>
    <div id="status" class="status">Preparing reset…</div>
    <button id="retryBtn" class="btn" style="display:none">Try Again</button>
  </main>
  <script>
    (function applyTheme() {
      try {
        const savedTheme = localStorage.getItem("darkMode");
        const dark = savedTheme === "true" || (savedTheme === null && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (_) {}
    })();

    function getReturnUrl() {
      const pathname = location.pathname.replace(/reset\.html$/i, "");
      const base = pathname.endsWith("/") ? pathname : `${pathname}/`;
      return `${base}index.html?fresh=${Date.now()}`;
    }

    async function clearIndexedDb() {
      if (!("indexedDB" in window)) return;
      if (indexedDB.databases) {
        try {
          const databases = await indexedDB.databases();
          await Promise.all((databases || []).map((db) => db?.name ? indexedDB.deleteDatabase(db.name) : Promise.resolve()));
          return;
        } catch (_) {}
      }
      const candidates = [
        "firebaseLocalStorageDb",
        "firebase-installations-database",
        "team-chat-db",
        "teamChatDb",
      ];
      await Promise.all(candidates.map((name) => {
        try { return indexedDB.deleteDatabase(name); } catch (_) { return Promise.resolve(); }
      }));
    }

    async function clearEverything() {
      const lines = [];
      const status = document.getElementById("status");
      const setStatus = (line) => {
        lines.push(line);
        if (status) status.textContent = lines.join("\n");
      };

      setStatus("Clearing local storage…");
      try { localStorage.clear(); } catch (_) { setStatus("Local storage could not be cleared."); }
      try { sessionStorage.clear(); } catch (_) { setStatus("Session storage could not be cleared."); }

      setStatus("Unregistering service workers…");
      if ("serviceWorker" in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        } catch (_) {
          setStatus("Service worker cleanup was partial.");
        }
      }

      setStatus("Deleting cached app files…");
      if ("caches" in window) {
        try {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        } catch (_) {
          setStatus("Cache Storage cleanup was partial.");
        }
      }

      setStatus("Clearing IndexedDB data…");
      try { await clearIndexedDb(); } catch (_) { setStatus("IndexedDB cleanup was partial."); }

      try { if ("clearAppBadge" in navigator) await navigator.clearAppBadge(); } catch (_) {}

      setStatus("Reset complete. Reloading the clean app…");
      location.replace(getReturnUrl());
    }

    const retryBtn = document.getElementById("retryBtn");
    retryBtn?.addEventListener("click", () => {
      retryBtn.disabled = true;
      clearEverything().catch((error) => {
        const status = document.getElementById("status");
        if (status) status.textContent = `Reset could not finish.\n${error?.message || error}`;
        retryBtn.disabled = false;
        retryBtn.style.display = "inline-flex";
      });
    });

    clearEverything().catch((error) => {
      const status = document.getElementById("status");
      if (status) status.textContent = `Reset could not finish.\n${error?.message || error}`;
      if (retryBtn) retryBtn.style.display = "inline-flex";
    });
  </script>
</body>
</html>
