<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#6366F1">
  <title>Family Album — Team Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <style>
    body { overflow: auto; }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    .album-header {
      display: flex; align-items: center; gap: var(--sp-3);
      padding: env(safe-area-inset-top,0) var(--sp-4) 0;
      height: calc(var(--header-h) + env(safe-area-inset-top,0));
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0; position: sticky; top: 0; z-index: var(--z-sticky);
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(160px, calc(50vw - 24px)), 1fr));
      gap: 3px; padding: 3px; flex: 1;
    }
    .album-item {
      aspect-ratio: 1; overflow: hidden; cursor: pointer; position: relative;
      background: var(--surface-3);
      transition: transform var(--dur-fast) var(--ease-spring);
    }
    .album-item:hover { transform: scale(1.02); z-index: 1; }
    .album-item img, .album-item video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .album-item-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.5), transparent);
      opacity: 0; transition: opacity var(--dur-fast);
      display: flex; align-items: flex-end; padding: var(--sp-2);
    }
    .album-item:hover .album-item-overlay { opacity: 1; }
    .album-item-meta { color: white; font-size: 11px; }
    .album-item-check {
      position: absolute; top: var(--sp-2); right: var(--sp-2);
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--accent); color: white;
      display: none; align-items: center; justify-content: center;
      font-size: 14px; border: 2px solid white;
    }
    .album-item.selected .album-item-check { display: flex; }
    .album-item.selected::after {
      content: ''; position: absolute; inset: 0;
      border: 3px solid var(--accent); pointer-events: none;
    }
    .filter-bar {
      display: flex; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none;
      flex-shrink: 0; background: var(--surface);
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      padding: 6px 16px; border-radius: var(--r-full);
      font-size: var(--ts-xs); font-weight: 600;
      background: var(--surface-3); border: 1.5px solid transparent;
      cursor: pointer; white-space: nowrap; color: var(--text-secondary);
      transition: all var(--dur-fast);
    }
    .filter-chip.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .month-heading {
      padding: var(--sp-3) var(--sp-4) var(--sp-2);
      font-size: var(--ts-xs); font-weight: 600; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: .7px;
      background: var(--bg);
    }
    .video-badge {
      position: absolute; top: var(--sp-2); left: var(--sp-2);
      background: rgba(0,0,0,.6); color: white;
      padding: 2px 6px; border-radius: var(--r-sm);
      font-size: 10px; font-weight: 600;
    }
    .select-bar {
      display: flex; align-items: center; gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      background: var(--accent); color: white;
      flex-shrink: 0; display: none;
    }
    .select-bar.visible { display: flex; }
    #media-content { flex: 1; overflow-y: auto; }
  </style>
</head>
<body>
<div id="app">
  <div class="album-header">
    <a href="index.html" class="icon-btn" aria-label="Back">
      <span class="material-symbols-rounded">arrow_back</span>
    </a>
    <span class="material-symbols-rounded" style="color:var(--accent)">photo_library</span>
    <div style="flex:1">
      <div style="font-size:var(--ts-base);font-weight:700">Family Album</div>
      <div style="font-size:var(--ts-xs);color:var(--text-tertiary)" id="media-count">Loading…</div>
    </div>
    <button class="icon-btn" id="select-btn" onclick="toggleSelect()" aria-label="Select">
      <span class="material-symbols-rounded">check_box</span>
    </button>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <span class="material-symbols-rounded" id="theme-toggle-icon">dark_mode</span>
    </button>
  </div>

  <div class="filter-bar">
    <button class="filter-chip active" onclick="setFilter(this,'all')">All</button>
    <button class="filter-chip" onclick="setFilter(this,'photos')">
      <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle">photo</span> Photos
    </button>
    <button class="filter-chip" onclick="setFilter(this,'videos')">
      <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle">videocam</span> Videos
    </button>
    <button class="filter-chip" onclick="setFilter(this,'links')">
      <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle">link</span> Links
    </button>
    <button class="filter-chip" onclick="setFilter(this,'docs')">
      <span class="material-symbols-rounded" style="font-size:13px;vertical-align:middle">description</span> Docs
    </button>
  </div>

  <!-- Selection bar -->
  <div class="select-bar" id="select-bar">
    <button onclick="toggleSelect()" style="color:white;background:none;border:none;cursor:pointer">
      <span class="material-symbols-rounded">close</span>
    </button>
    <span id="select-count">0 selected</span>
    <div style="flex:1"></div>
    <button style="color:white;background:none;border:none;cursor:pointer" aria-label="Download">
      <span class="material-symbols-rounded">download</span>
    </button>
    <button style="color:white;background:none;border:none;cursor:pointer" aria-label="Share">
      <span class="material-symbols-rounded">share</span>
    </button>
    <button style="color:white;background:none;border:none;cursor:pointer" aria-label="Delete">
      <span class="material-symbols-rounded">delete</span>
    </button>
  </div>

  <div id="media-content">
    <div class="loading-screen" style="height:300px" id="loading-state">
      <div class="spinner spinner-lg"></div>
      <div class="loading-text">Loading media…</div>
    </div>
    <div id="album-body" class="hidden"></div>
    <div class="empty-state hidden" id="empty-state" style="padding:var(--sp-12)">
      <div class="empty-icon">🖼️</div>
      <div class="empty-title">No media yet</div>
      <p class="empty-sub">Photos and videos shared in your chats will appear here.</p>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="media-viewer hidden" id="lightbox">
  <div class="media-viewer-top">
    <button onclick="closeLightbox()" style="color:white;background:none;border:none;cursor:pointer;padding:var(--sp-2)" aria-label="Close">
      <span class="material-symbols-rounded">close</span>
    </button>
    <div style="flex:1;color:rgba(255,255,255,.8);font-size:var(--ts-sm)" id="lightbox-caption"></div>
    <button class="icon-btn" style="color:rgba(255,255,255,.8)" onclick="downloadCurrent()" aria-label="Download">
      <span class="material-symbols-rounded">download</span>
    </button>
  </div>
  <div class="media-viewer-center">
    <button class="media-viewer-nav prev" onclick="navMedia(-1)" id="prev-btn" aria-label="Previous">
      <span class="material-symbols-rounded">chevron_left</span>
    </button>
    <div id="lightbox-content"></div>
    <button class="media-viewer-nav next" onclick="navMedia(1)" id="next-btn" aria-label="Next">
      <span class="material-symbols-rounded">chevron_right</span>
    </button>
  </div>
  <div class="media-viewer-bottom">
    <div class="media-viewer-action" onclick="shareCurrent()"><span class="material-symbols-rounded">share</span><span>Share</span></div>
    <div class="media-viewer-action" onclick="starCurrent()"><span class="material-symbols-rounded">star</span><span>Star</span></div>
    <div class="media-viewer-action" onclick="deleteCurrent()"><span class="material-symbols-rounded" style="color:var(--error)">delete</span><span style="color:var(--error)">Delete</span></div>
  </div>
</div>

<!-- Bottom nav linking to other sub-pages -->
<nav class="bottom-nav" style="display:flex" role="navigation" aria-label="Sub-pages">
  <a href="index.html" class="bottom-nav-item" aria-label="Chat">
    <div class="bottom-nav-item-icon"><span class="material-symbols-rounded">chat</span></div>
    <span>Chat</span>
  </a>
  <a href="album.html" class="bottom-nav-item active" aria-label="Album" aria-current="page">
    <div class="bottom-nav-item-icon"><span class="material-symbols-rounded">photo_library</span></div>
    <span>Album</span>
  </a>
  <a href="calendar.html" class="bottom-nav-item" aria-label="Calendar">
    <div class="bottom-nav-item-icon"><span class="material-symbols-rounded">calendar_month</span></div>
    <span>Calendar</span>
  </a>
  <a href="expenses.html" class="bottom-nav-item" aria-label="Expenses">
    <div class="bottom-nav-item-icon"><span class="material-symbols-rounded">receipt_long</span></div>
    <span>Expenses</span>
  </a>
  <a href="insights.html" class="bottom-nav-item" aria-label="Insights">
    <div class="bottom-nav-item-icon"><span class="material-symbols-rounded">insights</span></div>
    <span>Insights</span>
  </a>
</nav>

<script>
  // Apply saved theme
  const savedTheme = localStorage.getItem('tc_theme')||'system';
  if (savedTheme==='dark' || (savedTheme==='system' && window.matchMedia('(prefers-color-scheme:dark)').matches))
    document.documentElement.setAttribute('data-theme','dark');

  let allMedia = [], currentIndex = 0, selectMode = false, selectedItems = new Set(), currentFilter = 'all';

  // Generate demo media
  function generateMedia() {
    const colors = ['#6366F1','#8B5CF6','#EC4899','#06B6D4','#10B981','#F59E0B','#EF4444'];
    const months = ['June 2026','May 2026','April 2026','March 2026'];
    const items  = [];
    months.forEach((month, mi) => {
      const count = [8,6,10,5][mi];
      for (let i=0;i<count;i++) {
        const isVideo = Math.random() < .2;
        items.push({
          id: `m${mi}_${i}`, type: isVideo?'video':'photo',
          color: colors[Math.floor(Math.random()*colors.length)],
          month, sender: ['Aisha','Priya','Dev','Rohan','Sara'][Math.floor(Math.random()*5)],
          time: new Date(2026,5-mi,28-i*2).toLocaleDateString(),
          duration: isVideo ? `${Math.floor(Math.random()*3)+1}:${String(Math.floor(Math.random()*59)).padStart(2,'0')}` : null,
        });
      }
    });
    return items;
  }

  function renderAlbum(filter='all') {
    allMedia = generateMedia();
    const filtered = filter==='all' ? allMedia : allMedia.filter(m=>
      filter==='photos'?m.type==='photo' : filter==='videos'?m.type==='video' : false
    );

    document.getElementById('media-count').textContent = `${filtered.length} items`;

    if (!filtered.length) { hide('album-body'); show('empty-state'); return; }
    hide('empty-state'); show('album-body');

    const months = [...new Set(filtered.map(m=>m.month))];
    const body   = document.getElementById('album-body');
    body.innerHTML = months.map(month => {
      const items = filtered.filter(m=>m.month===month);
      return `<div class="month-heading">${month}</div>
        <div class="album-grid">
          ${items.map((item,idx)=>`
            <div class="album-item${selectedItems.has(item.id)?' selected':''}"
                 id="item-${item.id}"
                 onclick="handleItemClick('${item.id}',${filtered.indexOf(item)})"
                 style="background:${item.color}20">
              <div style="width:100%;height:100%;background:${item.color}30;display:flex;align-items:center;justify-content:center;font-size:32px">
                ${item.type==='video'?'🎬':'🖼️'}
              </div>
              ${item.type==='video'?`<div class="video-badge">▶ ${item.duration}</div>`:''}
              <div class="album-item-overlay">
                <div class="album-item-meta">${item.sender} · ${item.time}</div>
              </div>
              <div class="album-item-check"><span class="material-symbols-rounded" style="font-size:14px">check</span></div>
            </div>`).join('')}
        </div>`;
    }).join('');
  }

  function handleItemClick(id, idx) {
    if (selectMode) { toggleItemSelect(id); return; }
    openLightbox(idx);
  }

  function toggleItemSelect(id) {
    if (selectedItems.has(id)) selectedItems.delete(id); else selectedItems.add(id);
    document.getElementById('item-'+id)?.classList.toggle('selected', selectedItems.has(id));
    document.getElementById('select-count').textContent = `${selectedItems.size} selected`;
  }

  function toggleSelect() {
    selectMode = !selectMode;
    const bar = document.getElementById('select-bar');
    bar.classList.toggle('visible', selectMode);
    if (!selectMode) { selectedItems.clear(); document.querySelectorAll('.album-item.selected').forEach(el=>el.classList.remove('selected')); }
  }

  function setFilter(btn, filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderAlbum(filter);
  }

  function openLightbox(idx) {
    currentIndex = idx;
    const item = allMedia[idx];
    if (!item) return;
    document.getElementById('lightbox-caption').textContent = `${item.sender} · ${item.time}`;
    document.getElementById('lightbox-content').innerHTML = `
      <div style="width:min(500px,90vw);height:min(500px,70dvh);background:${item.color}20;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:80px">
        ${item.type==='video'?'🎬':'🖼️'}
      </div>`;
    document.getElementById('prev-btn').style.display = idx > 0 ? '' : 'none';
    document.getElementById('next-btn').style.display = idx < allMedia.length-1 ? '' : 'none';
    show('lightbox');
  }

  function closeLightbox() { hide('lightbox'); }
  function navMedia(dir) { openLightbox(currentIndex + dir); }
  function downloadCurrent() { showToast('Downloading…','info'); }
  function shareCurrent()    { showToast('Share…','info'); }
  function starCurrent()     { showToast('Starred ⭐','success'); }
  function deleteCurrent()   { closeLightbox(); showToast('Deleted','info'); }

  function toggleTheme() {
    const html = document.documentElement;
    const cur  = html.getAttribute('data-theme');
    const next = cur==='dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tc_theme', next);
    document.getElementById('theme-toggle-icon').textContent = next==='dark'?'light_mode':'dark_mode';
  }

  function show(id){ document.getElementById(id)?.classList.remove('hidden'); }
  function hide(id){ document.getElementById(id)?.classList.add('hidden'); }
  function showToast(msg,type){ console.log(type+':',msg); }

  // Boot
  setTimeout(() => {
    hide('loading-state');
    renderAlbum();
  }, 700);

  // Swipe to close lightbox on mobile
  let touchStartX = 0;
  document.getElementById('lightbox')?.addEventListener('touchstart', e=>touchStartX=e.touches[0].clientX);
  document.getElementById('lightbox')?.addEventListener('touchend', e=>{
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff)>60) navMedia(diff>0?1:-1);
  });
  document.addEventListener('keydown', e=>{
    if (e.key==='ArrowLeft') navMedia(-1);
    if (e.key==='ArrowRight') navMedia(1);
    if (e.key==='Escape') closeLightbox();
  });
</script>
</body>
</html>
