<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset — nishadsl.com</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f4f5;
      --card: #ffffff;
      --text: #111b21;
      --muted: #5f6f79;
      --accent: #00a884;
      --border: #d1d7db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b141a;
        --card: #1a2630;
        --text: #e9edef;
        --muted: #aebac1;
        --accent: #25d366;
        --border: #2a3942;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(0,168,132,0.14), transparent 40%), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.16);
      padding: 28px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid color-mix(in srgb, var(--accent) 18%, transparent);
      border-top-color: var(--accent);
      margin: 0 auto 18px;
      animation: spin 0.9s linear infinite;
    }
    h1 { margin: 0 0 10px; font-size: 1.7rem; }
    p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 0.98rem; }
    .status {
      margin-top: 18px;
      font-size: 0.92rem;
      color: var(--muted);
      padding: 12px 14px;
      border-radius: 14px;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 16%, transparent);
      text-align: left;
      white-space: pre-line;
    }
    .btn {
      margin-top: 18px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-height: 46px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
    .btn:disabled { opacity: 0.72; cursor: progress; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Resetting nishadsl.com</h1>
    <p>This is the browser-side equivalent of a hard refresh for this site, plus a full clear of saved web app data.</p>
    <div id="status" class="status">Preparing reset…</div>
    <button id="retryBtn" class="btn" style="display:none">Try Again</button>
  </main>
  <script>
    (function applyTheme() {
      try {
        const saved = localStorage.getItem("darkMode");
        if (saved === "true" || (saved === null && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (_) {}
    })();

    function getReturnUrl() {
      var params = new URLSearchParams(location.search);
      var ret = params.get("return") || params.get("redirect");
      if (ret && ret.startsWith(location.origin)) return ret + (ret.includes("?") ? "&" : "?") + "fresh=" + Date.now();
      var referrer = document.referrer;
      if (referrer && referrer.startsWith(location.origin)) return referrer + (referrer.includes("?") ? "&" : "?") + "fresh=" + Date.now();
      return location.origin + "/?fresh=" + Date.now();
    }

    function clearCookies() {
      var cookies = document.cookie.split("; ");
      for (var i = 0; i < cookies.length; i++) {
        var eq = cookies[i].indexOf("=");
        var name = eq > -1 ? cookies[i].substring(0, eq) : cookies[i];
        var domains = [location.hostname, "." + location.hostname, ""];
        var paths = ["/", "/resume", "/works/chat", "/works/invoice", "/works/admin", "/contact"];
        for (var d = 0; d < domains.length; d++) {
          for (var p = 0; p < paths.length; p++) {
            document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=" + paths[p] + "; domain=" + domains[d] + "; SameSite=Lax";
          }
        }
      }
    }

    async function clearIndexedDb() {
      if (!("indexedDB" in window)) return;
      if (indexedDB.databases) {
        try {
          var databases = await indexedDB.databases();
          var names = (databases || []).map(function(db) { return db.name; }).filter(Boolean);
          for (var i = 0; i < names.length; i++) {
            try { indexedDB.deleteDatabase(names[i]); } catch (_) {}
            if (names[i].includes("firebase") || names[i].includes("fcm") || names[i].includes("installation")) {
              try { indexedDB.deleteDatabase(names[i]); } catch (_) {}
            }
          }
          return;
        } catch (_) {}
      }
      var candidates = [
        "firebaseLocalStorageDb",
        "firebase-installations-database",
        "firebase-messaging-database",
        "fcm_log_data",
        "fcm_send_data",
        "team-chat-db",
        "teamChatDb",
        "syncAgentStorage",
        "notifications",
      ];
      for (var j = 0; j < candidates.length; j++) {
        try { indexedDB.deleteDatabase(candidates[j]); } catch (_) {}
      }
    }

    async function clearEverything() {
      var lines = [];
      var statusEl = document.getElementById("status");
      function setStatus(line) {
        lines.push(line);
        if (statusEl) statusEl.textContent = lines.join("\n");
      }

      setStatus("Clearing local & session storage…");
      try { localStorage.clear(); } catch (_) { setStatus("localStorage could not be cleared."); }
      try { sessionStorage.clear(); } catch (_) { setStatus("sessionStorage could not be cleared."); }

      setStatus("Clearing cookies…");
      try { clearCookies(); } catch (_) { setStatus("Cookie cleanup was partial."); }

      setStatus("Unregistering service workers…");
      if ("serviceWorker" in navigator) {
        try {
          var registrations = await navigator.serviceWorker.getRegistrations();
          for (var k = 0; k < registrations.length; k++) {
            try { await registrations[k].unregister(); } catch (_) {}
          }
        } catch (_) {
          setStatus("Service worker cleanup was partial.");
        }
      }

      setStatus("Deleting all caches…");
      if ("caches" in window) {
        try {
          var cacheNames = await caches.keys();
          for (var m = 0; m < cacheNames.length; m++) {
            try { await caches.delete(cacheNames[m]); } catch (_) {}
          }
        } catch (_) {
          setStatus("Cache Storage cleanup was partial.");
        }
      }

      setStatus("Clearing IndexedDB data…");
      try { await clearIndexedDb(); } catch (_) { setStatus("IndexedDB cleanup was partial."); }

      try { if ("clearAppBadge" in navigator) await navigator.clearAppBadge(); } catch (_) {}

      setStatus("Reset complete. Loading fresh page…");
      location.replace(getReturnUrl());
    }

    var retryBtn = document.getElementById("retryBtn");
    if (retryBtn) {
      retryBtn.addEventListener("click", function() {
        retryBtn.disabled = true;
        clearEverything().catch(function(error) {
          var statusEl = document.getElementById("status");
          if (statusEl) statusEl.textContent = "Reset could not finish.\n" + (error && error.message ? error.message : error);
          retryBtn.disabled = false;
          retryBtn.style.display = "inline-flex";
        });
      });
    }

    clearEverything().catch(function(error) {
      var statusEl = document.getElementById("status");
      if (statusEl) statusEl.textContent = "Reset could not finish.\n" + (error && error.message ? error.message : error);
      if (retryBtn) retryBtn.style.display = "inline-flex";
    });
  </script>
</body>
</html>
